<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Babies' Trivia</title>
<meta name="description" content="Trivia rounds for friends. One board per round, first run counts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --bg:#F7F4F1; --surface:#FFFFFF; --surface2:#EFEAE5; --line:#E2DAD2;
  --text:#1C1815; --muted:#6E655E;
  --accent:#D81B60; --accent2:#F4B400; --accent-ink:#FFFFFF;
  --good:#1E8A57; --good-bg:#E3F6EC; --bad:#C62B2B; --bad-bg:#FBE6E6;
  --shadow:0 10px 30px rgba(40,30,20,.10);
  --site:"Archivo Black","Arial Black",sans-serif;
  --display:"Archivo Black","Arial Black",sans-serif;
  --body:"Work Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141110; --surface:#1E1A18; --surface2:#2A2422; --line:#3A322E;
    --text:#F5F0EA; --muted:#B0A499; --accent-ink:#141110;
    --good:#4FD18A; --good-bg:#15301F; --bad:#FF6B6B; --bad-bg:#3A1717;
    --shadow:0 12px 34px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:680px;margin:0 auto;padding-block:16px 64px;padding-inline:16px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 10px}
.wordmark{font-family:var(--site);font-size:18px;letter-spacing:.01em;text-decoration:none;color:var(--text);background:none;border:0;padding:0;cursor:pointer;white-space:nowrap}
.wordmark span{color:var(--accent)}
.account{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.topright{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.refresh{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;cursor:pointer;color:var(--muted);padding:2px 2px;line-height:1}
.refresh:hover{color:var(--accent)}
.refresh:active svg{transform:rotate(90deg)}
.refresh svg{width:20px;height:20px;transition:transform .3s ease}
.refresh span{font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.account img{width:28px;height:28px;border-radius:50%;background:var(--surface2)}
.linkbtn{background:none;border:0;padding:4px 6px;color:var(--muted);cursor:pointer;text-decoration:underline;font-size:13px}
.hint{margin:0 0 6px;font-size:12px;color:var(--muted)}
.hint b{font-weight:600;color:var(--text)}

header.masthead{position:relative;padding:22px 0 16px;overflow:hidden}
header.masthead::before{content:"";position:absolute;inset:-40px -20px auto -20px;height:220px;pointer-events:none;
  background:radial-gradient(60% 80% at 20% 20%, color-mix(in srgb,var(--accent) 22%, transparent), transparent 70%),
             radial-gradient(40% 60% at 85% 30%, color-mix(in srgb,var(--accent2) 18%, transparent), transparent 70%)}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font-family:var(--display);font-size:clamp(48px,13vw,92px);line-height:.92;margin:0;letter-spacing:.01em;text-wrap:balance;
  background:linear-gradient(100deg,var(--accent) 0%,var(--accent) 55%,var(--accent2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1.site{font-family:var(--site);font-size:clamp(40px,10vw,68px)}
.sub{margin:10px 0 0;color:var(--muted);max-width:52ch}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:6px 0;color:var(--muted);cursor:pointer;font-size:14px}
.back:hover{color:var(--text)}

.tabs{display:flex;gap:4px;margin:8px 0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,.opt:focus-visible,select:focus-visible,.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.card.lift{box-shadow:var(--shadow)}
h2{font-family:var(--display);font-size:26px;margin:0 0 10px;line-height:1.1}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px;font-weight:600}
p{margin:0 0 12px}
.stack{display:grid;gap:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.note{font-size:13px;color:var(--muted);margin-top:10px}
select{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);max-width:100%}

.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);letter-spacing:.02em;transition:transform .08s ease,filter .15s ease;display:inline-flex;align-items:center;gap:10px}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
a.btn{text-decoration:none}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.small{padding:8px 14px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
.gicon{width:18px;height:18px;background:#fff;border-radius:50%;display:grid;place-items:center}

.gate{text-align:center;padding:36px 20px}
.gate h2{font-size:30px}
.gate p{max-width:40ch;margin:0 auto 20px;color:var(--muted)}

/* Lobby: standings up top, then compact tiles grouped by what to do next */
.section{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 10px;flex-wrap:wrap}
.section:first-child{margin-top:4px}
.section h3{margin:0}
.section .note{margin:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
.tile{--ra:var(--accent);--rb:var(--accent2);position:relative;display:flex;flex-direction:column;gap:5px;text-align:left;min-height:124px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px 18px;cursor:pointer;overflow:hidden;box-shadow:var(--shadow);transition:transform .1s ease}
.tile::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:linear-gradient(180deg,var(--ra),var(--rb))}
.tile:hover{transform:translateY(-1px)}
.tile .tn{font-family:var(--rf,var(--display));font-size:22px;line-height:1.05;background:linear-gradient(100deg,var(--ra),var(--ra) 60%,var(--rb));-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.tile .ts{font-size:12px;color:var(--muted)}
.tile .tf{margin-top:auto;padding-top:6px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.tile.closed{opacity:.6}
.tile .live{margin-top:0;font-size:12px}
.live{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--good);margin-top:8px;text-align:left}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;animation:pulse 1.6s ease-in-out infinite}
.live span{font-weight:400;color:var(--muted)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}

.board{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.lb{display:grid;grid-template-columns:34px 36px 1fr auto auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.lb:first-child{border-top:0}
.lb.me{background:color-mix(in srgb,var(--accent) 8%, var(--surface))}
.rank{font-family:var(--display);font-size:20px;color:var(--muted);text-align:center;line-height:1}
.lb:nth-child(1) .rank{color:var(--accent2)}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--surface2)}
.who{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.pts{font-family:var(--display);font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.pts span{font-size:13px;color:var(--muted);font-family:var(--body);font-weight:600}
.time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px;min-width:44px;text-align:right}
.empty{padding:26px 16px;color:var(--muted);text-align:center}

.progress{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .3s ease}
.qnum{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.q{font-size:22px;font-weight:600;line-height:1.3;margin:6px 0 18px;text-wrap:balance}
.timerbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:10px 14px;
  border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.timerbar .tleft{font-family:var(--display);font-size:22px;line-height:1;font-variant-numeric:tabular-nums;min-width:62px}
.timerbar .tnote{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.timerbar .tprog{flex:1;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.timerbar .tprog i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.timerbar.warn{border-color:var(--accent2)}
.timerbar.warn .tleft{color:var(--accent2)}
.timerbar.warn .tprog i{background:var(--accent2)}
.timerbar.danger{border-color:var(--bad);background:var(--bad-bg)}
.timerbar.danger .tleft{color:var(--bad)}
.timerbar.danger .tprog i{background:var(--bad)}
.pollopt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;
  padding:14px 16px;cursor:pointer;margin-bottom:10px;transition:border-color .12s ease}
.pollopt:hover:not([disabled]){border-color:var(--accent)}
.pollopt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pollopt[data-mine="1"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%, var(--surface))}
.pollopt .prow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pollopt .pname{font-weight:600;font-size:16px}
.pollopt .pcount{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pollopt .pbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:8px 0 8px}
.pollopt .pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .35s ease}
.pollopt .pblurb{font-size:13px;color:var(--muted);line-height:1.45}
.pollrow{margin-bottom:10px}
.pollrow .pollopt{margin-bottom:0}
.polladmin{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 4px 2px}
.polladmin .note{margin:0}
.tabdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:4px}
.stile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px}
.stile b{display:block;font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stile span{display:block;font-size:11px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.08em}
.srow{display:grid;grid-template-columns:104px 1fr auto;gap:10px;align-items:center;padding:7px 0}
.slab{font-size:14px;font-weight:600}
.sbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.sbar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.sval{font-size:14px;font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.sval small{color:var(--muted);font-size:11px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.pcard.me{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%, var(--surface))}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qvis{font-size:clamp(34px,11vw,52px);line-height:1.35;text-align:center;letter-spacing:.12em;margin:14px 0 4px;
  background:var(--surface2);border-radius:14px;padding:22px 14px;word-break:break-word}
.qimg{margin:14px 0 4px}
.qimg img{display:block;width:100%;max-height:340px;object-fit:cover;border-radius:14px;background:var(--surface2)}
.qimg figcaption{font-size:11px;color:var(--muted);margin-top:6px;text-align:center}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface2);border:1.5px solid transparent;border-radius:12px;padding:13px 14px;cursor:pointer;transition:border-color .12s ease,background .12s ease}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--display);font-size:14px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--muted);flex:none;line-height:1}
.opt[data-state="right"]{background:var(--good-bg);border-color:var(--good)}
.opt[data-state="right"] .k{background:var(--good);color:#fff}
.opt[data-state="wrong"]{background:var(--bad-bg);border-color:var(--bad)}
.opt[data-state="wrong"] .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt[data-state="sel"]{background:color-mix(in srgb,var(--accent) 12%, var(--surface2));border-color:var(--accent)}
.opt[data-state="sel"] .k{background:var(--accent);color:var(--accent-ink)}
.opt small{color:var(--muted);font-weight:400;font-size:12px}
.why{margin-top:14px;padding:14px;border-radius:12px;background:var(--surface2);border-left:4px solid var(--accent2)}
.why b{display:block;margin-bottom:4px}
.why.good{border-left-color:var(--good)}.why.bad{border-left-color:var(--bad)}
.stat{font-family:var(--display);font-size:clamp(64px,18vw,110px);line-height:.95;
  background:linear-gradient(100deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat small{font-size:.32em;font-family:var(--body);font-weight:600;color:var(--muted);-webkit-text-fill-color:var(--muted)}
.verdict{font-size:18px;font-weight:600;margin:6px 0 4px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--surface2);color:var(--muted)}
.pill.official{background:color-mix(in srgb,var(--accent2) 25%, var(--surface));color:var(--text)}
.pill.live{background:color-mix(in srgb,var(--good) 20%, var(--surface));color:var(--good)}
.pill.done{background:color-mix(in srgb,var(--accent) 14%, var(--surface));color:var(--text)}
.review .item{padding:12px 0;border-top:1px solid var(--line)}
.review .item:first-child{border-top:0}
.review .item .q{font-size:16px;margin:0 0 4px}
.review .ans{font-size:14px}
.review .ans.good{color:var(--good)}.review .ans.bad{color:var(--bad)}
.banner{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--accent2) 18%, var(--surface));border:1px solid color-mix(in srgb,var(--accent2) 40%, var(--line));font-size:14px;margin-bottom:14px}
.banner.err{background:var(--bad-bg);border-color:var(--bad)}
.roundlist .r{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.roundlist .r:first-child{border-top:0}
.share{margin-top:18px;padding:16px;border-radius:12px;background:var(--surface2)}
.share img{display:block;width:100%;max-width:340px;margin:0 auto 14px;border-radius:14px;box-shadow:var(--shadow)}
.share .msg{min-height:1.2em}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){.lb{grid-template-columns:28px 32px 1fr auto auto;gap:8px;padding:10px 10px}.pts{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="wordmark" id="home" title="Back to the homepage">Babies<span>'</span> Trivia</button>
    <div class="topright">
      <button class="refresh" id="refreshBtn" title="Refresh the page" aria-label="Refresh the page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 3v6h-6"></path></svg>
        <span>Refresh</span>
      </button>
      <div class="account" id="account"></div>
    </div>
  </div>
  <p class="hint" id="homeHint" hidden>Tip: click <b>Babies' Trivia</b> at the top any time to go back to the homepage.</p>

  <header class="masthead">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="roundName" class="site">Babies' Trivia</h1>
    <p class="sub" id="roundSub"></p>
  </header>

  <div id="nav" hidden>
    <button class="back" id="back">← All rounds</button>
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" aria-selected="true" data-tab="play">Play</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="board">Leaderboard</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="host" id="hostTab" hidden>Host</button>
    </div>
  </div>

  <main id="view" aria-live="polite"></main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
/* =====================================================================
   1. FIREBASE CONFIG  (from the Firebase console; safe to be public)
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCSX-DFjOt_GgT8i9PfpuH6VeF62QdIepA",
  authDomain: "babies-trivia.firebaseapp.com",
  projectId: "babies-trivia",
  storageBucket: "babies-trivia.firebasestorage.app",
  messagingSenderId: "692693528249",
  appId: "1:692693528249:web:bf9168672de6bfac25b568"
};

/* =====================================================================
   2. GAME SETTINGS  (change a line, re-upload the file)
   ===================================================================== */
const SETTINGS = {
  siteTagline: "Pick a round. Your first finished run of each round is your official score; after that you can practice all you like.",
  questionsPerGame: null,   // null = every question in the round; or a number like 15
  timeBreaksTies: true,     // true = faster time wins a tie; false = ties share a rank
  shuffleQuestions: false,  // true = each player gets a different question order (same set, scores stay comparable)
  shuffleAnswers: true,     // true = answer choices are shuffled (same shuffle for everyone, seeded)
  newRoundsOpenByDefault: true, // rounds added to this file are open until the host closes them
  timeLimitMs: 5 * 60 * 1000,   // countdown shown during a run; 0 or null = no limit. A round can override with its own timeLimitMs.
};

/* =====================================================================
   3. ROUNDS  (each has its own name, look and question bank)
   Add a round: copy one block, give it a new id, fill in questions.
   Each question: q = the question, o = four options, a = index of the
   correct option in o (0 = first), w = the explanation shown after answering,
   d = difficulty label ("easy", "medium" or "hard") shown on the question.

   HOUSE RULE for every round: at least 6 questions, mixed easy, medium and
   hard, with each difficulty making up at least a fifth of the round (never
   fewer than 2). The standard round is 20: 7 easy, 7 medium, 6 hard. Shorter
   rounds are fine. A round that breaks this logs a console warning at startup.
   Formats can be mixed freely inside one round; see rounds/README.md.
   A question can also carry a picture shown above it, either
   emoji: "🐝 👑 🎤"  (emoji clues, rendered large), or
   img: "images/name.jpg" with optional alt and credit (a file committed
   next to index.html, or any full https URL you have the right to use).
   theme.font is any Google Fonts family name; accent / accent2 are hex colors
   (the Dark versions are used when the player's device is in dark mode).
   ===================================================================== */
/* Poll shown on the front page. Change the options, or set open:false to close it. */
const POLL = {
  open: true,
  question: "What should the next round be?",
  note: "One vote each, and you can change it any time. Whatever wins gets built.",

  {

    tagline: "Twenty questions from the Taj Mahal to the Moon. Starts easy, ends hard.",
    theme: { font: "Yatra One", accent: "#D9730D", accent2: "#138808", accentDark: "#FFA24D", accent2Dark: "#4ADE80" },
    questions: [
      {d:"easy",q:"What is the capital of India?",
       o:["New Delhi","Mumbai","Kolkata","Bengaluru"],a:0,
       w:"The British moved the capital from Calcutta to Delhi in 1911. New Delhi, designed by Edwin Lutyens and Herbert Baker, was inaugurated in 1931."},
      {d:"easy",q:"The Taj Mahal stands in which city?",
       o:["Agra","Jaipur","Delhi","Lucknow"],a:0,
       w:"Shah Jahan built it on the bank of the Yamuna as a tomb for his wife Mumtaz Mahal. Work began in 1632 and the main tomb took about twelve years."},
      {d:"easy",q:"What is India's national animal?",
       o:["Bengal tiger","Asian elephant","Indian peacock","Asiatic lion"],a:0,
       w:"The tiger was declared national animal in 1972, the year before Project Tiger launched. India is now home to about three quarters of the world's wild tigers. The peacock is the national bird."},
      {d:"easy",q:"Which festival is known as the festival of lights?",
       o:["Diwali","Holi","Navratri","Onam"],a:0,
       w:"Diwali falls in October or November and for many marks Rama's return to Ayodhya. Holi, in spring, is the festival of colours."},
      {d:"easy",q:"Who is called the Father of the Nation in India?",
       o:["Mahatma Gandhi","Jawaharlal Nehru","B. R. Ambedkar","Subhas Chandra Bose"],a:0,
       w:"It was Subhas Chandra Bose who first called him that, in a 1944 radio broadcast. Gandhi's birthday, October 2, is a national holiday and the UN's International Day of Non-Violence."},
      {d:"easy",q:"What is the currency of India?",
       o:["Rupee","Rupiah","Taka","Ringgit"],a:0,
       w:"The ₹ symbol was adopted in 2010 from a design by D. Udaya Kumar. The rupiah is Indonesia's, the taka is Bangladesh's and the ringgit is Malaysia's."},
      {d:"easy",q:"Bollywood, the Hindi film industry, is based in which city?",
       o:["Mumbai","Chennai","Hyderabad","Kolkata"],a:0,
       w:"The B comes from Bombay. Chennai's Tamil industry is nicknamed Kollywood, after the Kodambakkam district, and Hyderabad's Telugu industry is Tollywood."},
      {d:"medium",q:"Which river, the holiest in Hinduism, flows past Varanasi?",
       o:["Ganga","Yamuna","Brahmaputra","Godavari"],a:0,
       w:"The Ganga rises at the Gangotri glacier in the Himalayas and runs about 2,500 km to the Bay of Bengal. The Yamuna joins it at Prayagraj."},
      {d:"medium",q:"How many times has India's men's team won the 50-over Cricket World Cup?",
       o:["Two","One","Three","Four"],a:0,
       w:"In 1983 under Kapil Dev, beating the West Indies at Lord's, and in 2011 under MS Dhoni, beating Sri Lanka at the Wankhede in Mumbai. The 2023 final was lost to Australia in Ahmedabad."},
      {d:"medium",q:"Who was India's first woman prime minister?",
       o:["Indira Gandhi","Sonia Gandhi","Pratibha Patil","Sarojini Naidu"],a:0,
       w:"She served from 1966 to 1977 and again from 1980 until her assassination in 1984. Pratibha Patil was the first woman president, in 2007, and Sarojini Naidu the first woman state governor."},
      {d:"medium",q:"Which city is known as the Pink City?",
       o:["Jaipur","Jodhpur","Udaipur","Jaisalmer"],a:0,
       w:"Maharaja Ram Singh II had the old city painted pink in 1876 to welcome the Prince of Wales. Jodhpur is the Blue City, Jaisalmer the Golden City and Udaipur the City of Lakes."},
      {d:"medium",q:"In which year did Chandrayaan-3 make India the first country to land near the Moon's south pole?",
       o:["2023","2019","2021","2024"],a:0,
       w:"The Vikram lander touched down on August 23, 2023, making India the fourth country to soft-land on the Moon. Chandrayaan-2's lander had crashed in 2019."},
      {d:"medium",q:"How many languages are listed in the Eighth Schedule of the Indian Constitution?",
       o:["22","14","18","29"],a:0,
       w:"The list started at 14 in 1950 and has grown to 22. Hindi in the Devanagari script is the official language of the Union, with English alongside it. India has no single national language."},
      {d:"medium",q:"The number 1729 is famous from a hospital visit conversation between G. H. Hardy and which Indian mathematician?",
       o:["Srinivasa Ramanujan","Aryabhata","Brahmagupta","Bhaskara II"],a:0,
       w:"Hardy said his taxi number was dull. Ramanujan replied it was the smallest number expressible as the sum of two cubes in two ways: 1³ + 12³ and 9³ + 10³."},
      {d:"hard",q:"How many spokes does the Ashoka Chakra on the Indian flag have?",
       o:["24","12","16","32"],a:0,
       w:"The wheel is taken from the Lion Capital of Ashoka at Sarnath. The flag was adopted on July 22, 1947, replacing the spinning wheel of the Congress flag with the chakra."},
      {d:"hard",q:"Which was the first Indian state created on linguistic lines, in 1953?",
       o:["Andhra State","Maharashtra","Gujarat","Kerala"],a:0,
       w:"It was carved out of Madras State after Potti Sriramulu died on a 58-day hunger strike for a Telugu-speaking state. The States Reorganisation Act redrew the whole map in 1956."},
      {d:"hard",q:"Which Indian physicist won the 1930 Nobel Prize for the light-scattering effect that bears his name?",
       o:["C. V. Raman","Satyendra Nath Bose","Homi J. Bhabha","Jagadish Chandra Bose"],a:0,
       w:"Raman was the first Asian to win a science Nobel. He made the discovery on February 28, 1928, now National Science Day. S. N. Bose gave his name to bosons but never won."},
      {d:"hard",q:"In which year did Babur win the First Battle of Panipat and found the Mughal Empire?",
       o:["1526","1556","1498","1600"],a:0,
       w:"Babur's artillery beat the much larger army of Ibrahim Lodi. The Second Battle of Panipat came in 1556, Vasco da Gama reached Calicut in 1498, and the East India Company was chartered in 1600."},
      {d:"hard",q:"Where was the first Indian Institute of Technology established, in 1951?",
       o:["Kharagpur","Bombay","Madras","Delhi"],a:0,
       w:"It was set up in the buildings of the Hijli detention camp, where the British had held independence activists. IIT Bombay followed in 1958, Madras and Kanpur in 1959 and Delhi in 1961."},
      {d:"hard",q:"What is the highest mountain located entirely within India?",
       o:["Nanda Devi","Kangchenjunga","Kamet","Trisul"],a:0,
       w:"Nanda Devi rises to 7,816 metres in Uttarakhand. Kangchenjunga is higher, but it straddles the border between Sikkim and Nepal. Kamet is India's second highest at 7,756 metres."},

  },

const $ = id => document.getElementById(id);
const $view = $("view");

/* --- theme --- */
const loadedFonts = new Set();
function ensureFont(f){ if (!f || loadedFonts.has(f)) return; const l = document.createElement("link"); l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?family=" + encodeURIComponent(f).replace(/%20/g, "+") + "&display=swap"; document.head.appendChild(l); loadedFonts.add(f); }
ROUNDS.forEach(r => ensureFont(r.theme && r.theme.font));
function applyTheme(r){
  const root = document.documentElement.style; const h = $("roundName");
  if (!r) { root.removeProperty("--accent"); root.removeProperty("--accent2"); root.removeProperty("--display"); h.className = "site"; h.textContent = "Babies' Trivia"; $("eyebrow").textContent = me ? (openCount() === 1 ? "1 round open" : openCount() + " rounds open") : "Trivia for friends"; $("roundSub").textContent = SETTINGS.siteTagline; return; }
  const t = themeOf(r);
  root.setProperty("--accent", t.a); root.setProperty("--accent2", t.b);
  if (t.font) root.setProperty("--display", `"${t.font}","Archivo Black","Arial Black",sans-serif`); else root.removeProperty("--display");

}
const openCount = () => ROUNDS.filter(r => isPublished(r) && isOpen(r)).length;
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderAll);

/* --- progress persistence (per player, per round, this device) --- */
const progKey = () => "bt.progress." + (round ? round.id : "none") + "." + (me ? me.uid : "anon");
function saveProgress(){ try { localStorage.setItem(progKey(), JSON.stringify({ i: S.i, picks: S.picks, order: S.order, started: S.started })); } catch (e) {} }
function loadProgress(){ S.screen = "home"; S.chosen = null; S.sel = []; S.seq = []; S.checked = false; S.lastResult = null; try { const p = JSON.parse(localStorage.getItem(progKey()) || "null"); if (p && Array.isArray(p.picks) && Array.isArray(p.order) && p.order.length) { S.i = p.i; S.picks = p.picks; S.order = p.order; S.started = p.started; S.screen = "quiz"; } } catch (e) {} }
function clearProgress(){ try { localStorage.removeItem(progKey()); } catch (e) {} }

/* --- auth --- */
async function signIn(){
  const provider = new firebase.auth.GoogleAuthProvider();
  try { await auth.signInWithPopup(provider); }
  catch (e) {
    if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment" || e.code === "auth/cancelled-popup-request")) { await auth.signInWithRedirect(provider); }
    else if (e && e.code === "auth/unauthorized-domain") { fatal = "This web address isn't on the Firebase authorized domains list yet. Host: add it under Authentication → Settings → Authorized domains."; renderAll(); }
    else if (e && e.code !== "auth/popup-closed-by-user") { fatal = "Sign in failed: " + (e.message || e.code); renderAll(); }
  }
}
auth.getRedirectResult().catch(() => {});
auth.onAuthStateChanged(async u => {
  me = u; isHost = false; fatal = "";
  if (me) { isHost = await probeHost(); subscribeSite(); subscribeScores(); subscribePresence(); subscribeVotes(); subscribeRounds(); subscribePollCfg();
    if (pendingRound && roundById(pendingRound) && isPublished(roundById(pendingRound))) { const id = pendingRound; pendingRound = null; selectRound(id); return; } pendingRound = null; }
  else { if (unsubScores) { unsubScores(); unsubScores = null; } if (unsubSite) { unsubSite(); unsubSite = null; } if (unsubPresence) { unsubPresence(); unsubPresence = null; } if (unsubVotes) { unsubVotes(); unsubVotes = null; } if (unsubRounds) { unsubRounds(); unsubRounds = null; } if (unsubPollCfg) { unsubPollCfg(); unsubPollCfg = null; } pollCfg = null; votes = []; votesReady = false; presence = []; presenceRound = null; stopTimer(); if (hbTimer) { clearInterval(hbTimer); hbTimer = null; } round = null; S.tab = "play"; }
  renderAll();
});
async function probeHost(){
  try { await dbf.collection("site").doc("config").set({ hostSeenAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }); return true; }
  catch (e) { return false; }
}
function subscribeSite(){
  if (unsubSite) unsubSite();
  unsubSite = dbf.collection("site").doc("config").onSnapshot(snap => {
    const d = snap.exists ? snap.data() : {};
    openIds = Array.isArray(d.openRounds) ? new Set(d.openRounds) : (SETTINGS.newRoundsOpenByDefault ? new Set(ROUNDS.map(r => r.id)) : new Set());
    liveIds = new Set(Array.isArray(d.liveRounds) ? d.liveRounds : []);
    renderAll();
  }, err => { fatal = "Couldn't reach the database: " + (err.code || err.message); renderAll(); });
}
function subscribeScores(){
  if (unsubScores) unsubScores();
  unsubScores = dbf.collection("scores").onSnapshot(snap => { scores = snap.docs.map(d => ({ id: d.id, ...d.data() })); scoresReady = true; render(); },
    err => { fatal = "Couldn't load scores: " + (err.code || err.message); render(); });
}
/* --- presence: who is mid-quiz right now --- */
function subscribePresence(){
  if (unsubPresence) unsubPresence();
  unsubPresence = dbf.collection("presence").onSnapshot(snap => { presence = snap.docs.map(d => d.data()); if (showsPresence()) render(); }, () => {});
}
const showsPresence = () => !!me && !fatal && (!round || (S.tab === "play" && S.screen === "home"));
const playingNow = rid => presence.filter(p => p.roundId === rid && p.uid !== (me && me.uid) && (Date.now() - (p.at || 0)) < PRESENCE_TTL);
function namesHtml(list){ const n = list.map(p => esc((p.name || "Someone").split(" ")[0])); return n.length <= 3 ? n.join(", ") : n.slice(0, 3).join(", ") + " and " + (n.length - 3) + " more"; }
function liveHtml(rid){ const l = playingNow(rid); return l.length ? `<div class="live"><i></i>Playing now <span>${namesHtml(l)}</span></div>` : ""; }
async function writePresence(){
  if (!me || !presenceRound) return;
  const rid = presenceRound, uid = me.uid;
  try { await dbf.collection("presence").doc(uid).set({ uid, name: me.displayName || "Someone", photo: me.photoURL || "", roundId: rid, at: Date.now(), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    if (presenceRound !== rid) await dbf.collection("presence").doc(uid).delete(); } catch (e) {}
}
async function clearPresence(){
  if (hbTimer) { clearInterval(hbTimer); hbTimer = null; }
  if (!me || !presenceRound) return;
  presenceRound = null;
  try { await dbf.collection("presence").doc(me.uid).delete(); } catch (e) {}
}
function syncPresence(){
  const want = (me && round && S.screen === "quiz") ? round.id : null;
  if (want === presenceRound) return;
  if (!want) { clearPresence(); return; }
  presenceRound = want; writePresence();
  if (hbTimer) clearInterval(hbTimer);
  hbTimer = setInterval(writePresence, 30 * 1000);
}
window.addEventListener("pagehide", () => { clearPresence(); });
setInterval(() => { if (showsPresence()) render(); }, 30 * 1000); // lets stale heartbeats drop off

/* --- poll --- */
function subscribeRounds(){
  if (unsubRounds) unsubRounds();
  unsubRounds = dbf.collection("rounds").onSnapshot(snap => {
    let added = false;
    snap.docs.forEach(d => {
      const data = d.data(); const id = data.id || d.id;
      if (!id || roundById(id) || !Array.isArray(data.questions) || !data.questions.length) return;
      const r = Object.assign({}, data, { id, _fromDb: true });
      try { processQuestions(r); ensureFont(r.theme && r.theme.font); ROUNDS.push(r); added = true; }
      catch (e) { console.warn("Skipped a round from the database:", id, e && e.message); }
    });
    if (added) renderAll();
  }, () => {});
}
function subscribePollCfg(){
  if (unsubPollCfg) unsubPollCfg();
  unsubPollCfg = dbf.collection("site").doc("poll").onSnapshot(snap => { pollCfg = snap.exists ? snap.data() : null; if (!round) render(); }, () => {});
}
const pollNow = () => (pollCfg && Array.isArray(pollCfg.options) && pollCfg.options.length) ? pollCfg : POLL;
const pollOptions = () => pollNow().options.filter(o => { const r = roundById(o.id); return !(r && r.draft && isPublished(r)); });
function subscribeVotes(){
  if (unsubVotes) unsubVotes();
  unsubVotes = dbf.collection("votes").onSnapshot(snap => { votes = snap.docs.map(d => d.data()); votesReady = true; if (!round && lobbyTab === "poll") render(); }, () => { votesReady = true; });
}
const myVote = () => { const v = votes.find(v => v.uid === (me && me.uid)); return v ? v.choice : null; };
const voteCount = id => votes.filter(v => v.choice === id).length;
async function setLive(id, on){
  if (!me) return;
  const r = roundById(id); if (!r || !r.draft) return;
  const next = new Set(liveIds); on ? next.add(id) : next.delete(id);
  try { await dbf.collection("site").doc("config").set({ liveRounds: [...next] }, { merge: true }); }
  catch (e) { const el = $("pollMsg"); if (el) el.textContent = "Couldn't update the lobby: " + (e.code || e.message); }
}
async function castVote(id){
  if (!me || !pollNow().open) return;
  try { await dbf.collection("votes").doc(me.uid).set({ uid: me.uid, name: me.displayName || "Someone", photo: me.photoURL || "", choice: id, at: firebase.firestore.FieldValue.serverTimestamp() }); }
  catch (e) { const el = $("pollMsg"); if (el) el.textContent = "Couldn't save your vote (" + (e.code || e.message) + ")."; }
}

const boardFor = rid => scores.filter(s => s.roundId === rid);
const myOfficial = (rid = round && round.id) => rid ? boardFor(rid).find(b => b.uid === (me && me.uid)) || null : null;
function sorted(list){ return [...list].sort((a, b) => (b.score - a.score) || (SETTINGS.timeBreaksTies ? (a.elapsedMs - b.elapsedMs) : 0) || String(a.finishedAt).localeCompare(String(b.finishedAt))); }
function rankOf(list){ const s = sorted(list); let last = null, rank = 0; return s.map((b, i) => { const key = b.score + (SETTINGS.timeBreaksTies ? ":" + b.elapsedMs : ""); if (key !== last) { rank = i + 1; last = key; } return { ...b, rank }; }); }

/* --- navigation --- */
$("home").onclick = () => goLobby();
$("refreshBtn").onclick = () => location.reload();
$("back").onclick = () => goLobby();
function goLobby(){ stopTimer(); round = null; S.tab = "play"; resetShare(); renderAll(); window.scrollTo({ top: 0 }); }
function selectRound(id, tab = "play"){ const r = roundById(id); if (!r || !isPublished(r)) return goLobby(); stopTimer(); round = r; boardSel = id; S.tab = tab; resetShare(); loadProgress(); renderAll(); window.scrollTo({ top: 0 }); }
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));

/* --- render --- */
function renderAll(){
  applyTheme(round);
  renderAccount();
  $("nav").hidden = !(me && round);
  $("homeHint").hidden = !me;
  $("hostTab").hidden = !isHost;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)));
  render();
}
function renderAccount(){
  const a = $("account");
  if (!me) { a.innerHTML = ""; return; }
  a.innerHTML = `<img src="${esc(me.photoURL || "")}" alt="" onerror="this.style.visibility='hidden'"><span>${esc(me.displayName || "You")}</span>${isHost ? `<button class="linkbtn" id="hostBtn">Host</button>` : ""}<button class="linkbtn" id="signout">Sign out</button>`;
  $("signout").onclick = async () => { await clearPresence(); auth.signOut(); };
  const hb = $("hostBtn"); if (hb) hb.onclick = () => selectRound(round ? round.id : ROUNDS[0].id, "host");
}
function render(){
  syncPresence();
  if (fatal) { $view.innerHTML = `<div class="banner err">${esc(fatal)}</div>` + (me ? "" : gateHtml()); if (!me) wireGate(); return; }
  if (!me) { $view.innerHTML = gateHtml(); wireGate(); return; }
  if (!round) return renderLobby();
  if (S.tab === "board") return renderBoard();
  if (S.tab === "host") return renderHost();
  if (!isOpen(round) && S.screen !== "result") return renderClosed();
  if (S.screen === "quiz") { const l = timeLeft(); if (l !== null && l <= 0) { finishRun(true); return; } return renderQuiz(); }
  if (S.screen === "result") return renderResult();
  return renderHome();
}
function gateHtml(){
  return `<div class="card lift gate"><h2>Sign in to play</h2><p>One tap with Google. Your name and photo go on the leaderboard, nothing else is used.</p>
    <button class="btn" id="signin"><span class="gicon"><svg width="12" height="12" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.3l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.2 5.5-4.7 7.2l7.6 5.9c4.4-4.1 6.9-10.1 6.9-17.6z"/><path fill="#FBBC05" d="M10.5 28.6A14.5 14.5 0 0 1 9.7 24c0-1.6.3-3.1.8-4.6l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg></span>Continue with Google</button></div>`;
}
function wireGate(){ const b = $("signin"); if (b) b.onclick = signIn; }

let lobbySel = ALL, lobbyAll = false, lobbyTab = "rounds", lobbyOld = false;
const RECENT_IN_PICKER = 7, RECENT_IN_LOBBY = 12;
const addedKey = r => r.added || "";
const byRecent = (a, b) => addedKey(a) === addedKey(b) ? ROUNDS.indexOf(b) - ROUNDS.indexOf(a) : (addedKey(b) > addedKey(a) ? 1 : -1);
function pickerHtml(id, sel){
  const vis = ROUNDS.filter(isPublished).sort(byRecent);
  const opt = x => `<option value="${esc(x.id)}" ${x.id === sel ? "selected" : ""}>${esc(x.name)}${isOpen(x) ? "" : " (closed)"}</option>`;
  const recent = vis.slice(0, RECENT_IN_PICKER), older = vis.slice(RECENT_IN_PICKER);
  return `<select id="${id}" aria-label="Which leaderboard to show"><option value="${ALL}" ${sel === ALL ? "selected" : ""}>All rounds combined</option>${older.length ? `<optgroup label="Recent">${recent.map(opt).join("")}</optgroup><optgroup label="Older">${older.map(opt).join("")}</optgroup>` : recent.map(opt).join("")}</select>`;
}
function boardList(sel){ return sel === ALL ? combined() : boardFor(sel); }
function renderLobby(){

  const tabs = `<div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="${lobbyTab === "rounds"}" data-ltab="rounds">Rounds</button>
    <button class="tab" role="tab" aria-selected="${lobbyTab === "poll"}" data-ltab="poll">Next round${needsVote ? `<span class="tabdot" title="You haven't voted"></span>` : ""}</button>
    <button class="tab" role="tab" aria-selected="${lobbyTab === "stats"}" data-ltab="stats">Stats</button>
  </div>`;
  const wire = () => document.querySelectorAll("[data-ltab]").forEach(b => b.onclick = () => { lobbyTab = b.dataset.ltab; renderLobby(); window.scrollTo({ top: 0 }); });
  if (lobbyTab === "poll") { $view.innerHTML = tabs + pollHtml(); wire(); wirePoll(); return; }
  if (lobbyTab === "stats") { $view.innerHTML = tabs + statsHtml(); wire(); return; }
  return renderRounds(tabs, wire);
}
function pollHtml(){
  const P = pollNow(), opts = pollOptions(), visIds = new Set(opts.map(o => o.id));

    const r = roundById(o.id);
    const admin = !isHost ? "" : (r && r.draft
      ? `<div class="polladmin"><button class="btn small" data-pub="${esc(o.id)}">Add to lobby</button><span class="note">Ready, ${r.questions.length} questions written.</span></div>`
      : `<div class="polladmin"><span class="note">No round written for this theme yet.</span></div>`);
    return `<div class="pollrow"><button class="pollopt" data-p="${esc(o.id)}" data-mine="${mine === o.id ? 1 : 0}"${P.open ? "" : " disabled"}>
      <div class="prow"><span class="pname">${esc(o.name)}${mine === o.id ? " ✓" : ""}${c && c === best && total ? ` <span class="pill live">Leading</span>` : ""}</span><span class="pcount">${c} vote${c === 1 ? "" : "s"}${total ? " · " + pct + "%" : ""}</span></div>
      <div class="pbar"><i style="width:${pct}%"></i></div>

    : !opts.length ? `<p class="note">Nothing to vote on right now. New themes will appear here.</p>`
    : !P.open ? `<p class="note">Voting is closed.</p>`
    : mine ? `<p class="note">Your vote is in. Tap another to change it. ${total} vote${total === 1 ? "" : "s"} so far.</p>`
    : `<p class="note">Tap one to vote. ${total ? total + (total === 1 ? " vote" : " votes") + " so far." : "Be the first."}</p>`;
  const drafts = isHost ? ROUNDS.filter(r => r.draft) : [];
  const hostList = drafts.length ? `<div class="section"><h3>Rounds you've written</h3><span class="note">Only you see this</span></div><div class="card"><div class="roundlist">${drafts.map(r => `<div class="r"><div><b>${esc(r.name)}</b><br><span class="note" style="margin:0">${esc(r.subject || "")} · ${r.questions.length} questions · ${boardFor(r.id).length} played</span></div>${isPublished(r) ? `<div class="row"><span class="pill live">In the lobby</span><button class="linkbtn" data-unpub="${esc(r.id)}">Remove</button></div>` : `<button class="btn small" data-pub="${esc(r.id)}">Add to lobby</button>`}</div>`).join("")}</div></div>` : "";
  return `<div class="card lift" style="margin-bottom:14px"><h2>${esc(P.question || "What should the next round be?")}</h2><p class="note" style="margin:0">${esc(P.note || "")}</p>${isHost ? `<p class="note" style="margin:8px 0 0">Host: <b>Add to lobby</b> makes a round playable at once and takes it off this poll.</p>` : ""}</div>
    ${rows}${status}<p class="note" id="pollMsg"></p>${hostList}`;
}
/* --- stats: computed from official runs; nothing extra is stored --- */
const pct = (a, b) => b ? Math.round((a / b) * 100) : 0;
function typeLabel(q){ const t = qType(q); if (t === "select") return "Select all"; if (t === "order") return "Put in order"; return (q.o && q.o.length === 2) ? "True or false" : "Multiple choice"; }
function computeStats(){
  const players = {}, byDiff = { easy: [0, 0], medium: [0, 0], hard: [0, 0] }, byType = {}, perQ = {};
  let runs = 0, totalMs = 0, totalQ = 0;
  scores.forEach(sc => {
    const r = roundById(sc.roundId); if (!r || !Array.isArray(sc.order) || !Array.isArray(sc.picks)) return;
    runs++; totalMs += sc.elapsedMs || 0; totalQ += sc.order.length;
    const p = players[sc.uid] || (players[sc.uid] = { uid: sc.uid, name: sc.name, photo: sc.photo, runs: 0, q: 0, ok: 0, ms: 0, timeouts: 0, last: "", diff: { easy: [0, 0], medium: [0, 0], hard: [0, 0] } });
    p.runs++; p.ms += sc.elapsedMs || 0; if (sc.timedOut) p.timeouts++; if ((sc.finishedAt || "") > p.last) { p.last = sc.finishedAt; p.name = sc.name; p.photo = sc.photo; }
    sc.order.forEach((qi, k) => { const q = r.questions[qi]; if (!q) return; const ok = qCorrect(q, sc.picks[k]) ? 1 : 0;
      p.q++; p.ok += ok; if (q.d && p.diff[q.d]) { p.diff[q.d][0] += ok; p.diff[q.d][1]++; }
      if (q.d && byDiff[q.d]) { byDiff[q.d][0] += ok; byDiff[q.d][1]++; }
      const tl = typeLabel(q); const bt = byType[tl] || (byType[tl] = [0, 0]); bt[0] += ok; bt[1]++;
      const key = r.id + ":" + qi; const pq = perQ[key] || (perQ[key] = { r, q, ok: 0, n: 0 }); pq.ok += ok; pq.n++;
    });
  });
  return { players: Object.values(players), byDiff, byType, perQ: Object.values(perQ), runs, totalMs, totalQ };
}
function barHtml(label, a, b){ const v = pct(a, b); return `<div class="srow"><div class="slab">${esc(label)}</div><div class="sbar" title="${v}% right across ${b} answers"><i style="width:${v}%"></i></div><div class="sval">${v}%<small> of ${b}</small></div></div>`; }
function statsHtml(){

    if(t==="mc") document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ S.chosen=+b.dataset.k; S.picks[S.i]=S.chosen; saveProgress(); renderQuiz(); });
    else if(t==="select"){ document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ const k=+b.dataset.k, ss=new Set(S.sel||[]); ss.has(k)?ss.delete(k):ss.add(k); S.sel=[...ss]; saveProgress(); renderQuiz(); }); const c=$("check"); if(c) c.onclick=()=>{ S.picks[S.i]=[...(S.sel||[])].sort((a,b)=>a-b); S.checked=true; saveProgress(); renderQuiz(); }; }
    else { document.querySelectorAll(".opt[data-k]").forEach(b=>b.onclick=()=>{ S.seq=[...(S.seq||[]), +b.dataset.k]; saveProgress(); renderQuiz(); }); const rb=$("orderReset"); if(rb) rb.onclick=()=>{ S.seq=[]; saveProgress(); renderQuiz(); }; const c=$("check"); if(c) c.onclick=()=>{ S.picks[S.i]=(S.seq||[]).slice(); S.checked=true; saveProgress(); renderQuiz(); }; }

}
async function advance(){

}
async function finishRun(timedOut){

  const limit = timeLimit();

  const score = S.order.reduce((n, qi, k) => n + (qCorrect(round.questions[qi], S.picks[k]) ? 1 : 0), 0);
  const unanswered = S.order.filter((_, k) => S.picks[k] == null).length;
  const result = { uid: me.uid, name: me.displayName || "Someone", photo: me.photoURL || "", roundId: round.id, score, total: S.order.length, elapsedMs, timedOut: !!timedOut, finishedAt: new Date().toISOString(), order: S.order, picks: S.picks.slice(), createdAt: firebase.firestore.FieldValue.serverTimestamp() };

}
function renderResult(){
  const r = S.lastResult; if (!r) { S.screen = "home"; return renderHome(); }
  const b = boardFor(round.id); const mine = rankOf(b).find(x => x.uid === me.uid);
  let saveLine = "";

  else if (S.saved === "saved") saveLine = `<p class="note">Posted to the leaderboard${mine ? ` — you're #${mine.rank} of ${b.length}` : ""}.</p>`;
  else if (S.saved === "failed") saveLine = `<p class="note">Couldn't post your score (${esc(S.saveErr)}).${S.saveErr === "permission-denied" ? " You may already have an official score for this round." : ""}</p>`;
  else if (S.saved === "closed") saveLine = `<p class="note">This round is closed, so this run doesn't post.</p>`;
  else if (myOfficial()) saveLine = `<p class="note">Practice run. Your official score of ${myOfficial().score} / ${myOfficial().total} stands.</p>`;
  $view.innerHTML = `<div class="card lift">
      <h3>Your score</h3>
      <div class="stat">${r.score}<small> / ${r.total}</small></div>
      <div class="verdict">${r.timedOut ? "Time." : verdict(r.score, r.total)}</div>
      <p class="note" style="margin-top:0">Time: ${fmtTime(r.elapsedMs)}${r.timedOut ? ` — the clock ran out${S.unanswered ? ` with ${S.unanswered} question${S.unanswered === 1 ? "" : "s"} unanswered` : ""}.` : ""}</p>
      ${saveLine}
      <div class="row" style="margin-top:14px">
        <button class="btn" id="toBoard">See the leaderboard</button>
        <button class="btn ghost" id="share">${S.shareKind === "score" ? "Hide share card" : "Share my score"}</button>
        <button class="btn ghost" id="review">${S.review ? "Hide answers" : "Review my answers"}</button>
        <button class="btn ghost" id="again">Play again</button>
        <button class="btn ghost" id="lobby">All rounds</button>
      </div>
      ${S.shareKind === "score" ? sharePanelHtml() : ""}
      ${S.review ? `<div class="review" style="margin-top:18px">${r.order.map((qi, k) => { const it = round.questions[qi]; const p = r.picks[k]; const ok = qCorrect(it, p);
        return `<div class="item"><div class="q">${k + 1}. ${esc(it.q)}</div><div class="ans ${ok ? "good" : "bad"}">${reviewAns(it, p)}</div></div>`; }).join("")}</div>` : ""}
    </div>`;
  $("toBoard").onclick = () => { boardSel = round.id; setTab("board"); };
  $("review").onclick = () => { S.review = !S.review; renderResult(); };
  $("share").onclick = () => toggleShare("score");
  wireShare();
  $("again").onclick = startQuiz;
  $("lobby").onclick = goLobby;
}

/* --- share cards: your score, or an invite to a round --- */
const siteUrl = () => location.origin + location.pathname.replace(/index\.html$/, "");
const roundLink = r => siteUrl() + "?round=" + encodeURIComponent(r.id);
function resetShare(){ S.shareKind = null; S.shareUrl = ""; S.shareFile = null; S.shareMsg = ""; }
function toggleShare(kind){
  if (S.shareKind === kind) S.shareKind = null; else { resetShare(); S.shareKind = kind; }
  render(); if (S.shareKind && !S.shareUrl) prepareShare(kind);
}
function shareContext(){
  const r = S.lastResult; const b = boardFor(round.id);
  const official = S.saved === "saved"; const mine = official ? rankOf(b).find(x => x.uid === me.uid) : null;
  return { r, official, rank: mine ? mine.rank : 0, of: b.length };
}
function difficultyNote(r){ const d = new Set(r.questions.map(q => q.d).filter(Boolean)); return d.size > 1 ? "Easy to hard" : ""; }
function shareText(){
  if (S.shareKind === "invite") {
    return `New round on Babies' Trivia: "${round.name}". ${round.questions.length} questions on ${(round.subject || "").toLowerCase() || "everything"}. ${round.tagline || ""}\nPlay now: ${roundLink(round)}`;
  }
  const { r, official, rank, of } = shareContext();
  const grid = r.order.map((qi, k) => qCorrect(round.questions[qi], r.picks[k]) ? "🟩" : "🟥").join("").replace(/(.{20})(?=.)/gu, "$1\n");
  const where = official && rank ? ` That's #${rank} of ${of} on the board.` : (official ? "" : " (practice run)");
  return `I scored ${r.score}/${r.total} on "${round.name}" at Babies' Trivia in ${fmtTime(r.elapsedMs)}.${where}\n${grid}\nThink you can beat me? ${roundLink(round)}`;
}
function rrect(x, X, Y, W, H, R){ x.beginPath(); x.moveTo(X + R, Y); x.arcTo(X + W, Y, X + W, Y + H, R); x.arcTo(X + W, Y + H, X, Y + H, R); x.arcTo(X, Y + H, X, Y, R); x.arcTo(X, Y, X + W, Y, R); x.closePath(); }
function fitText(x, text, family, size, maxW, min = 30){ for (;;) { x.font = `${size}px ${family}`; if (x.measureText(text).width <= maxW || size <= min) return size; size -= 4; } }
function wrapLines(x, text, maxW, maxLines){ const out = []; let cur = ""; for (const w of String(text).split(/\s+/)) { const t = cur ? cur + " " + w : w; if (x.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; } if (cur) out.push(cur); if (out.length > maxLines) { out.length = maxLines; out[maxLines - 1] = out[maxLines - 1].replace(/\W*$/, "") + "…"; } return out; }
async function drawShareCard(kind){
  const t = (round.theme || {}); const A = t.accent || "#D81B60", B = t.accent2 || "#F4B400";
  const fam = `${t.font ? `"${t.font}",` : ""}"Archivo Black","Arial Black",sans-serif`;
  const body = `"Work Sans","Helvetica Neue",Arial,sans-serif`;
  try { await Promise.all([document.fonts.load(`80px "Archivo Black"`), document.fonts.load(`80px "Work Sans"`), document.fonts.load(`600 80px "Work Sans"`), t.font ? document.fonts.load(`80px "${t.font}"`) : Promise.resolve()]); } catch (e) {}
  const W = 1080, H = 1080, c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d");
  const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, A); g.addColorStop(1, B); x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = "rgba(0,0,0,.38)"; rrect(x, 64, 64, W - 128, H - 128, 44); x.fill();
  x.textAlign = "center"; x.textBaseline = "alphabetic"; x.fillStyle = "#fff";
  x.font = `34px ${body}`; x.globalAlpha = .85; x.fillText("BABIES' TRIVIA", W / 2, 150); x.globalAlpha = 1;
  const host = siteUrl().replace(/^https?:\/\//, "").replace(/\/$/, "");
  const footer = () => { const hs = fitText(x, host, body, 28, W - 220, 18); x.font = `${hs}px ${body}`; x.globalAlpha = .7; x.fillText(hs <= 18 && x.measureText(host).width > W - 220 ? location.host : host, W / 2, 984); x.globalAlpha = 1; };
  if (kind === "invite") {
    x.font = `600 30px ${body}`; x.globalAlpha = .85; x.fillText("NEW ROUND", W / 2, 232); x.globalAlpha = 1;
    x.font = `100px ${fam}`; const nameLines = wrapLines(x, round.name, W - 200, 2); const ns = nameLines.length === 1 ? fitText(x, round.name, fam, 120, W - 200) : 100;
    x.font = `${ns}px ${fam}`; nameLines.forEach((l, i) => x.fillText(l, W / 2, 360 + i * (ns * .95)));
    let y = 360 + (nameLines.length - 1) * (ns * .95) + 62;
    x.font = `32px ${body}`; x.globalAlpha = .8; x.fillText((round.subject || "").toUpperCase(), W / 2, y); x.globalAlpha = 1; y += 70;
    x.font = `36px ${body}`; const tl = wrapLines(x, round.tagline || "", W - 260, 3); tl.forEach((l, i) => x.fillText(l, W / 2, y + i * 48)); y += tl.length * 48 + 30;
    const dn = difficultyNote(round); x.font = `600 30px ${body}`; x.globalAlpha = .85; x.fillText(`${round.questions.length} QUESTIONS${dn ? "  ·  " + dn.toUpperCase() : ""}`, W / 2, y); x.globalAlpha = 1;
    const by = Math.max(y + 60, 760), bw = 460, bh = 116; x.fillStyle = "#fff"; rrect(x, W / 2 - bw / 2, by, bw, bh, bh / 2); x.fill();
    x.fillStyle = A; x.font = `56px ${fam}`; x.textBaseline = "middle"; x.fillText("PLAY NOW", W / 2, by + bh / 2 + 2); x.textBaseline = "alphabetic"; x.fillStyle = "#fff";
    footer(); 
  } else {
    const { r, official, rank, of } = shareContext();
    const nameSize = fitText(x, round.name, fam, 88, W - 220); x.font = `${nameSize}px ${fam}`; x.fillText(round.name, W / 2, 262);
    x.font = `30px ${body}`; x.globalAlpha = .8; x.fillText((round.subject || "").toUpperCase(), W / 2, 312); x.globalAlpha = 1;
    x.font = `250px ${fam}`; x.fillText(String(r.score), W / 2 - 60, 590);
    const sw = x.measureText(String(r.score)).width;
    x.font = `70px ${fam}`; x.globalAlpha = .75; x.textAlign = "left"; x.fillText(`/ ${r.total}`, W / 2 - 60 + sw / 2 + 24, 590); x.textAlign = "center"; x.globalAlpha = 1;
    x.font = `600 40px ${body}`; x.fillText(verdict(r.score, r.total), W / 2, 668);
    const n = r.order.length, per = Math.min(n, 10), rows = Math.ceil(n / per), gap = 54, rad = 18, y0 = 748;
    r.order.forEach((qi, k) => { const row = Math.floor(k / per), col = k % per, count = Math.min(per, n - row * per);
      const cx = W / 2 - ((count - 1) * gap) / 2 + col * gap, cy = y0 + row * gap; const ok = qCorrect(round.questions[qi], r.picks[k]);
      x.beginPath(); x.arc(cx, cy, rad, 0, Math.PI * 2); x.fillStyle = ok ? "#34D399" : "rgba(255,255,255,.22)"; x.fill(); if (!ok) { x.lineWidth = 3; x.strokeStyle = "rgba(255,255,255,.55)"; x.stroke(); } });
    const metaY = y0 + rows * gap + 30;
    x.fillStyle = "#fff"; x.font = `600 34px ${body}`;
    const meta = official && rank ? `#${rank} of ${of} on the board  ·  ${fmtTime(r.elapsedMs)}` : (official ? fmtTime(r.elapsedMs) : `Practice run  ·  ${fmtTime(r.elapsedMs)}`);
    x.fillText(meta, W / 2, metaY);
    x.font = `600 34px ${body}`; x.globalAlpha = .9; x.fillText("Think you can beat me?", W / 2, 940); x.globalAlpha = 1;
    footer();
  }
  const blob = await new Promise(res => c.toBlob(res, "image/png"));
  const fname = kind === "invite" ? `babies-trivia-${round.id}.png` : "babies-trivia-score.png";
  return { url: c.toDataURL("image/png"), file: blob ? new File([blob], fname, { type: "image/png" }) : null };
}
async function prepareShare(kind){
  let out = null, err = "";
  try { out = await drawShareCard(kind); } catch (e) { err = "Couldn't build the image on this device, but you can still send the text."; }
  if (S.shareKind !== kind) return;
  if (out) { S.shareUrl = out.url; S.shareFile = out.file; } else S.shareMsg = err;
  render();
}
function sharePanelHtml(){
  const canFiles = !!(navigator.canShare && S.shareFile && navigator.canShare({ files: [S.shareFile] }));
  const canShare = !!navigator.share;
  const alt = S.shareKind === "invite" ? `Invite card: play ${esc(round.name)} on Babies' Trivia` : `Score card: ${S.lastResult.score} out of ${S.lastResult.total} on ${esc(round.name)}`;
  const fname = S.shareKind === "invite" ? `babies-trivia-${esc(round.id)}.png` : "babies-trivia-score.png";
  return `<div class="share" id="sharePanel">
    ${S.shareUrl ? `<img src="${S.shareUrl}" alt="${alt}">` : `<p class="note" style="text-align:center">Building the card…</p>`}
    <div class="row" style="justify-content:center">
      ${canShare ? `<button class="btn small" id="shareNative">${canFiles ? "Share image" : "Share"}</button>` : ""}
      <a class="btn ghost small" id="shareSms" href="sms:?&body=${encodeURIComponent(shareText())}">Text it</a>
      ${S.shareUrl ? `<a class="btn ghost small" id="shareSave" href="${S.shareUrl}" download="${fname}">Save image</a>` : ""}
      <button class="btn ghost small" id="shareCopy">Copy text</button>
    </div>
    <p class="note msg" id="shareMsg" style="text-align:center">${esc(S.shareMsg)}</p>
    ${!canFiles && S.shareUrl ? `<p class="note" style="text-align:center;margin-top:4px">To text the picture, save the image and attach it to your message.</p>` : ""}
  </div>`;
}
function wireShare(){
  const say = m => { S.shareMsg = m; const el = $("shareMsg"); if (el) el.textContent = m; };
  const n = $("shareNative"); if (n) n.onclick = async () => {
    const text = shareText(); const files = S.shareFile && navigator.canShare && navigator.canShare({ files: [S.shareFile] }) ? [S.shareFile] : undefined;
    try { await navigator.share(files ? { files, text, title: "Babies' Trivia" } : { text, title: "Babies' Trivia" }); say("Shared."); }
    catch (e) { if (!e || e.name !== "AbortError") { try { await navigator.share({ text, title: "Babies' Trivia" }); say("Shared the text. Save the image to send the picture too."); } catch (e2) { say("Sharing didn't open. Try Text it or Save image."); } } }
  };
  const c = $("shareCopy"); if (c) c.onclick = async () => { try { await navigator.clipboard.writeText(shareText()); say("Copied. Paste it into any message."); } catch (e) { say("Couldn't copy on this device."); } };
}

applyTheme(null);
$view.innerHTML = `<div class="card gate"><p>Loading…</p></div>`;
</script>

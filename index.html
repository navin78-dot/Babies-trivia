<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B👶🏽bies' Trivia</title>
<meta name="description" content="Trivia rounds for friends. One board per round, first run counts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&family=Archivo+Black&display=swap">
<style>
/* =====================================================================
   Babies' Trivia: a late-night game-show set. Ink stage, cream paper cards,
   coral and gold. Colours live on :root; a round swaps --accent/--glow.
   ===================================================================== */
:root{
  --stage:#0B0A14; --stage2:#151329; --stage3:#211D40;
  --paper:#FFF8EC; --paper2:#F5EBD9; --paper3:#EBDFC8; --line:#E2D4BA;
  --ink:#1A1424; --ink2:#645B78;
  --cream:#F8F2E7; --cream2:#B4ABC6;
  --accent:#FF3D71; --accent2:#FFC533; --glow:#FF3D71; --glow2:#FFC533; --accent-ink:#fff;
  --good:#1E9E5A; --good-bg:#DDF5E6; --bad:#D8383E; --bad-bg:#FBE2E1; --part:#B25A08; --part-bg:#FCEFD8;
  --gold:#F5B62E; --silver:#C9D1DB; --bronze:#D08A55;
  --shadow:0 18px 44px rgba(0,0,0,.42),0 2px 6px rgba(0,0,0,.3);
  --shadow-lg:0 30px 70px rgba(0,0,0,.55),0 4px 10px rgba(0,0,0,.35);
  --site:"Bricolage Grotesque","Archivo Black","Arial Black",sans-serif;
  --display:"Bricolage Grotesque","Archivo Black","Arial Black",sans-serif;
  --body:"Manrope","Helvetica Neue",Arial,sans-serif;
  --text:var(--cream); --muted:var(--cream2);
  --ghost-bg:rgba(255,255,255,.09); --ghost-sh:rgba(0,0,0,.45); --ghost-line:rgba(255,255,255,.12);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--stage)}
body{background:var(--stage);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;font-weight:500;-webkit-font-smoothing:antialiased;letter-spacing:-.005em;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(70% 55% at 10% -12%, color-mix(in srgb,var(--glow) 30%, transparent), transparent 62%),
    radial-gradient(60% 50% at 96% -8%, color-mix(in srgb,var(--glow2) 22%, transparent), transparent 62%),
    radial-gradient(100% 50% at 50% 118%, color-mix(in srgb,var(--glow) 12%, transparent), transparent 70%),
    linear-gradient(180deg,var(--stage2) 0%,var(--stage) 46%);
  transition:background .6s ease}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.07;mix-blend-mode:screen;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
button{font:inherit;color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:680px;margin:0 auto;padding-block:12px 72px;padding-inline:16px}

/* surfaces: anything paper flips the text tokens */
.card,.board,.stile,.pcard,.pollopt,.share,.lcard,.timerbar.paper{--text:var(--ink);--muted:var(--ink2);--ghost-bg:var(--paper3);--ghost-sh:var(--line);--ghost-line:transparent;color:var(--ink)}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 14px}
.wordmark{font-family:var(--site);font-size:20px;font-weight:800;letter-spacing:-.01em;text-decoration:none;color:var(--cream);background:none;border:0;padding:0;cursor:pointer;white-space:nowrap}
.wordmark span{color:var(--glow2)}
.bt-baby{font-style:normal;color:initial;-webkit-text-fill-color:initial;background:none;display:inline-block;vertical-align:-.06em;font-size:.95em;line-height:1}
h1 .bt-baby{font-size:.86em;vertical-align:-.02em;margin:0 -.02em}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.topright{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.refresh{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;cursor:pointer;color:var(--cream2);padding:4px 6px;line-height:1;border-radius:10px}
.refresh:hover{color:var(--cream);background:rgba(255,255,255,.06)}
#refreshBtn:active svg{transform:rotate(90deg)}
.refresh svg{width:20px;height:20px;transition:transform .3s ease}
.refresh span{font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
#soundBtn .smute{display:none}
#soundBtn.muted .sw1,#soundBtn.muted .sw2{display:none}
#soundBtn.muted .smute{display:block}
#soundBtn.muted{color:var(--accent)}
.account{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--cream2);margin-left:6px}
.mechip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:3px 12px 3px 3px;cursor:pointer;color:var(--cream);font-weight:700;font-size:13px}
.mechip:hover{background:rgba(255,255,255,.14)}
.mechip.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.linkbtn{background:none;border:0;padding:4px 6px;color:var(--muted);cursor:pointer;text-decoration:underline;font-size:13px;font-weight:600}
.linkbtn:hover{color:var(--text)}

/* ---------- masthead ---------- */
header.masthead{position:relative;padding:26px 0 18px;overflow:visible}
.emblem{position:absolute;right:-6px;top:-10px;font-size:112px;line-height:1;opacity:.14;pointer-events:none;transform:rotate(-10deg);filter:saturate(1.2);user-select:none}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--cream2);margin:0 0 8px;font-weight:800}
h1{font-family:var(--display);font-size:clamp(50px,13.5vw,96px);line-height:.92;margin:0;letter-spacing:-.025em;text-wrap:balance;position:relative;
  background:linear-gradient(100deg,var(--glow) 0%,var(--glow) 42%,var(--glow2) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 10px 30px color-mix(in srgb,var(--glow) 35%, transparent));animation:sheen 10s ease-in-out infinite alternate}
h1.site{font-family:var(--site);font-size:clamp(44px,11vw,76px)}
@keyframes sheen{from{background-position:0% 50%}to{background-position:100% 50%}}
.sub{margin:12px 0 0;color:var(--cream2);max-width:52ch;font-size:16.5px;line-height:1.55}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:6px 0;color:var(--cream2);cursor:pointer;font-size:14px;font-weight:700}
.back:hover{color:var(--cream)}

/* ---------- tabs (segmented) ---------- */
.tabs{display:flex;gap:2px;margin:8px 0 20px;padding:4px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:9px 15px;font-weight:800;color:var(--cream2);border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .15s ease,color .15s ease}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.tab:focus-visible,.btn:focus-visible,.opt:focus-visible,select:focus-visible,.tile:focus-visible,.avopt:focus-visible{outline:2px solid var(--glow2);outline-offset:2px}
.tabdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle;box-shadow:0 0 8px var(--accent)}

/* ---------- paper ---------- */
.card{background:var(--paper);border-radius:22px;padding:22px;position:relative;box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;inset:0;border-radius:22px;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 0 0 1px rgba(120,90,40,.06)}
.card.lift{box-shadow:var(--shadow-lg)}
h2{font-family:var(--display);font-size:27px;margin:0 0 10px;line-height:1.05;letter-spacing:-.02em}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);margin:0 0 10px;font-weight:800}
p{margin:0 0 12px}
.stack{display:grid;gap:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.note{font-size:13px;color:var(--muted);margin-top:10px}
select{font:inherit;font-weight:700;padding:8px 34px 8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23B4ABC6' stroke-width='2' stroke-linecap='round'/></svg>") no-repeat right 12px center;color:var(--cream);max-width:100%;-webkit-appearance:none;appearance:none}
select option{color:#111;background:#fff}
.card select{background-color:var(--paper2);color:var(--ink);border-color:var(--line)}
.field{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper2);color:var(--ink);margin-top:4px}
.field:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea.field{resize:vertical;min-height:72px;line-height:1.45}
.inrow{display:flex;gap:8px;align-items:stretch;margin-top:4px}
.inrow .field{margin-top:0;flex:1;min-width:0}
.inrow .btn{white-space:nowrap;flex:none}

/* ---------- buttons: chunky, pressable ---------- */
.btn{border:0;border-radius:14px;padding:12px 22px;font-weight:800;cursor:pointer;background:var(--accent);color:var(--accent-ink);letter-spacing:.01em;display:inline-flex;align-items:center;gap:10px;position:relative;
  box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 55%, #000),0 12px 24px color-mix(in srgb,var(--accent) 30%, transparent);transition:transform .08s ease,box-shadow .08s ease,filter .15s ease}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%, #000),0 4px 10px color-mix(in srgb,var(--accent) 20%, transparent)}
.btn.ghost{background:var(--ghost-bg);color:var(--text);border:1px solid var(--ghost-line);box-shadow:0 4px 0 var(--ghost-sh)}
.btn.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ghost-sh)}
a.btn{text-decoration:none}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 40%, transparent)}
.btn.small{padding:8px 14px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.5;cursor:default;transform:none;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.gicon{width:18px;height:18px;background:#fff;border-radius:50%;display:grid;place-items:center}

.gate{text-align:center;padding:36px 20px}
.gate h2{font-size:32px}
.gate p{max-width:40ch;margin:0 auto 20px;color:var(--muted)}

/* ---------- sections ---------- */
.section{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px;flex-wrap:wrap}
.section:first-child{margin-top:4px}
.section h3{margin:0;color:var(--cream2)}
.section h3::before{content:"";display:inline-block;width:18px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--glow),var(--glow2));margin-right:9px;vertical-align:middle}
.section .note{margin:0}
.banner{padding:13px 16px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-size:14px;margin-bottom:14px;color:var(--cream)}
.banner.ann{background:linear-gradient(120deg,color-mix(in srgb,var(--glow) 28%, var(--stage2)),color-mix(in srgb,var(--glow2) 24%, var(--stage2)));border-color:color-mix(in srgb,var(--glow) 45%, transparent);font-weight:800;box-shadow:0 10px 30px color-mix(in srgb,var(--glow) 18%, transparent)}
.banner.err{background:color-mix(in srgb,var(--bad) 22%, var(--stage2));border-color:var(--bad)}

/* ---------- season panel ---------- */
.season-hero{position:relative;margin:0 0 20px;padding:18px 18px 14px;border-radius:22px;color:var(--cream);overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 22%, var(--stage3)),var(--stage2) 60%,color-mix(in srgb,var(--glow) 18%, var(--stage2)));
  border:1px solid color-mix(in srgb,var(--gold) 45%, transparent);box-shadow:0 16px 40px rgba(0,0,0,.45),inset 0 1px 0 color-mix(in srgb,var(--gold) 60%, transparent),0 0 40px color-mix(in srgb,var(--gold) 14%, transparent)}
.season-hero::before{content:"🏆";position:absolute;right:-10px;bottom:-22px;font-size:120px;opacity:.1;transform:rotate(-12deg);pointer-events:none}
.sh-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.sh-kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--gold)}
.sh-title{font-family:var(--display);font-size:40px;line-height:1;letter-spacing:-.02em;margin:2px 0 6px;background:linear-gradient(100deg,#FFE28A,var(--gold) 60%,#E08A2E);-webkit-background-clip:text;background-clip:text;color:transparent}
.sh-sub{font-size:13px;color:var(--cream2);font-weight:600;line-height:1.4}
.sh-clock{text-align:right;min-width:150px}
.sh-label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--cream2)}
.sh-count{font-family:var(--display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--cream);text-shadow:0 0 18px color-mix(in srgb,var(--gold) 50%, transparent)}
.sh-you{display:flex;align-items:center;gap:12px;margin-top:14px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:14px;line-height:1.4;color:var(--cream2)}
.sh-you b{color:var(--cream)}
.sh-you .shy-msg{flex:1;min-width:0}
.sh-you .emoav{flex:0 0 auto}
.sh-here{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pchip{display:inline-flex;align-items:center;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;color:var(--cream2);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
.pchip b{color:var(--cream);font-weight:800}
.pchip.playing{background:color-mix(in srgb,var(--good) 22%, transparent);border-color:color-mix(in srgb,var(--good) 50%, transparent);color:var(--cream)}
.pchip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cream2);box-shadow:0 0 6px color-mix(in srgb,var(--cream2) 70%, transparent);animation:pulse 2.6s ease-in-out infinite;margin-right:7px;flex:none}
.pchip.playing::before{background:var(--good);box-shadow:0 0 9px var(--good);animation:pulse 1.5s ease-in-out infinite}
.pchip.quiet{opacity:.7}
.pchip.quiet::before{display:none}
.pchip .emoav.xs{margin-right:5px}
.sh-you .btn{white-space:nowrap}
.sh-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;color:var(--cream2);font-weight:600;line-height:1.45}
.sh-foot b{color:var(--cream)}
.sh-foot .linkbtn{color:var(--gold);padding:0;white-space:nowrap}
.sh-body{margin-top:10px;font-size:14px;color:var(--cream);line-height:1.5}
.sh-body p{margin:0 0 8px}
.sh-body b{color:var(--gold)}
.season-line{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:-6px 0 16px;padding:9px 14px;border-radius:12px;font-size:13px;color:var(--cream2);font-weight:600;
  background:rgba(255,255,255,.06);border:1px solid color-mix(in srgb,var(--gold) 30%, transparent)}
.season-line b{color:var(--gold)}
.season-line .szc{font-family:var(--display);font-size:15px;color:var(--cream);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:420px){.sh-title{font-size:34px}.sh-count{font-size:24px}.sh-clock{min-width:0}}

/* ---------- round posters ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
.tile{--ra:var(--glow);--rb:var(--glow2);position:relative;display:flex;flex-direction:column;gap:5px;text-align:left;min-height:152px;color:var(--cream);
  background:linear-gradient(150deg,color-mix(in srgb,var(--ra) 62%, var(--stage2)) 0%,color-mix(in srgb,var(--rb) 38%, var(--stage2)) 62%,var(--stage3) 100%);
  border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:16px 16px 14px;cursor:pointer;overflow:hidden;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .18s cubic-bezier(.2,.7,.2,1),box-shadow .2s ease}
.tile::before{content:attr(data-emblem);position:absolute;right:-8px;bottom:-14px;font-size:92px;line-height:1;opacity:.3;transform:rotate(-12deg);pointer-events:none;filter:saturate(1.3) drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.tile::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(135deg,rgba(255,255,255,.045) 0 2px,transparent 2px 11px);mix-blend-mode:overlay}
.tile:hover{transform:translateY(-4px) scale(1.01);box-shadow:var(--shadow-lg),inset 0 1px 0 rgba(255,255,255,.25)}
.tile:active{transform:translateY(0) scale(.99)}
.tile .tn{font-family:var(--rf,var(--display));font-size:24px;line-height:1.02;color:#fff;letter-spacing:-.015em;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.35);position:relative;z-index:1;padding-right:24px}
.tile .ts{font-size:12px;color:rgba(255,255,255,.78);font-weight:700;position:relative;z-index:1}
.tile .tf{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:rgba(255,255,255,.8);font-weight:700;position:relative;z-index:1}
.tile.closed{filter:saturate(.35) brightness(.72)}
.tile .live{margin-top:0;font-size:12px;color:#fff;position:relative;z-index:1}
.tile .live span{color:rgba(255,255,255,.85)}
.tile .pill{background:rgba(0,0,0,.28);color:#fff;backdrop-filter:blur(6px)}
.tile .pill.live{background:rgba(255,255,255,.92);color:var(--ink)}
.tile .pill.done{background:rgba(255,255,255,.18);color:#fff}
.live{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--good);margin-top:8px;text-align:left}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;animation:pulse 1.6s ease-in-out infinite;box-shadow:0 0 10px var(--good)}
.live span{font-weight:500;color:var(--muted)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}

/* ---------- leaderboard and podium ---------- */
.board{border-radius:20px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow)}
.lb{display:grid;grid-template-columns:34px 40px 1fr auto auto;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line);transition:background .15s ease}
.lb:first-child{border-top:0}
.lb:hover{background:var(--paper2)}
.lb.me{background:color-mix(in srgb,var(--accent) 9%, var(--paper));box-shadow:inset 3px 0 0 var(--accent)}
.rank{font-family:var(--display);font-size:15px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;margin:0 auto;color:var(--ink2);background:var(--paper3);line-height:1}
.rank.medal-1,.board .lb:not(.rest) .rank[data-r="1"]{background:linear-gradient(135deg,#FFE28A,#E0A72E);color:#3B2A00;box-shadow:0 4px 10px rgba(224,167,46,.4)}
.rank[data-r="2"]{background:linear-gradient(135deg,#F1F4F8,#B8C0CB);color:#2B3440}
.rank[data-r="3"]{background:linear-gradient(135deg,#EFC29C,#B87545);color:#3A2210}
.av{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:var(--paper3)}
.who{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.pts{font-family:var(--display);font-size:23px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pts span{font-size:13px;color:var(--muted);font-family:var(--body);font-weight:700}
.time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px;min-width:44px;text-align:right;font-weight:600}
.empty{padding:26px 16px;color:var(--muted);text-align:center}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;margin:6px 0 12px;padding:0 6px}
.podium.n2{grid-template-columns:repeat(2,minmax(0,1fr));max-width:400px;margin-inline:auto}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.pod::before{content:"";position:absolute;left:50%;top:-30px;width:170px;height:170px;transform:translateX(-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,color-mix(in srgb,var(--podc) 34%, transparent),transparent 65%);filter:blur(6px)}
.pod.p1{--podc:var(--gold);--ph:98px}.pod.p2{--podc:var(--silver);--ph:74px}.pod.p3{--podc:var(--bronze);--ph:58px}
.pod .podav{position:relative;z-index:1;margin-bottom:8px;animation:bob 4s ease-in-out infinite}
.pod.p2 .podav{animation-delay:-1.3s}.pod.p3 .podav{animation-delay:-2.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pod .podav .emoav{width:64px;height:64px;box-shadow:0 0 0 4px var(--podc),0 0 28px color-mix(in srgb,var(--podc) 55%, transparent)}
.pod.p1 .podav .emoav{width:76px;height:76px}
.podname{font-weight:800;font-size:14px;color:var(--cream);position:relative;z-index:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podpts{font-family:var(--display);font-size:20px;color:var(--cream);line-height:1.1;margin-bottom:2px;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.podsub{font-size:11px;font-weight:800;color:var(--cream2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px;position:relative;z-index:1}
.podpts span{font-size:12px;color:var(--cream2);font-family:var(--body);font-weight:700}
.plinth{width:100%;height:var(--ph);border-radius:14px 14px 6px 6px;position:relative;
  background:linear-gradient(180deg,color-mix(in srgb,var(--podc) 55%, var(--stage3)),color-mix(in srgb,var(--podc) 22%, var(--stage2)));
  box-shadow:inset 0 2px 0 color-mix(in srgb,var(--podc) 80%, #fff),inset 0 -10px 20px rgba(0,0,0,.25),0 14px 30px rgba(0,0,0,.4);display:grid;place-items:start center;padding-top:8px}
.plinth span{font-family:var(--display);font-size:26px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.pod.me .podname{color:var(--glow2)}
.pod .medals{justify-content:center;color:var(--cream2);margin:-4px 0 8px;position:relative;z-index:1}
.champs{display:grid;gap:8px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);margin:-6px 0 12px}
.seg button{background:none;border:0;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:800;color:var(--cream2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.medals{display:inline-flex;gap:7px;margin-top:2px;font-size:12px;font-weight:800;color:var(--muted);line-height:1.3}
.medals .md{font-style:normal;display:inline-flex;align-items:center;gap:1px}
.medals .md b{font-size:11px;font-variant-numeric:tabular-nums}
.medals.none{font-weight:600;opacity:.7}
.lb.mrow{grid-template-columns:34px 40px 1fr auto}
.mcount{display:flex;gap:10px;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.mcount span{display:inline-flex;align-items:center;gap:2px}
.trow .who{display:flex;flex-direction:column;min-width:0}
.trow .who .medals{color:var(--cream2)}
.trophies{display:grid;gap:6px}
.trow{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:9px 14px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.trow .who{color:var(--cream)}
.trow.now{grid-template-columns:auto 1fr auto;background:linear-gradient(120deg,color-mix(in srgb,var(--gold) 22%, var(--stage3)),var(--stage2));border-color:color-mix(in srgb,var(--gold) 45%, transparent)}
.trow .tnow{font-size:26px;line-height:1;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--gold) 70%, transparent))}
.tcups{font-size:18px;letter-spacing:-.08em;white-space:nowrap;text-align:right}
.tcups .none{color:var(--cream2);font-size:14px}

/* ---------- avatars ---------- */
.emoav{width:36px;height:36px;border-radius:50%;background:var(--paper3);display:grid;place-items:center;font-size:22px;line-height:1;flex:none;position:relative;box-shadow:0 0 0 2px rgba(255,255,255,.25),0 4px 10px rgba(0,0,0,.25)}
.emoav.sm{width:28px;height:28px;font-size:17px}
.emoav.lg{width:56px;height:56px;font-size:34px}
.emoav.xs{width:20px;height:20px;font-size:13px;display:inline-grid;vertical-align:-5px;margin-right:4px;box-shadow:none}
.emoav svg,.emoav img{width:100%;height:100%;display:block;border-radius:50%}
.emoav.ini{background:hsl(var(--h) 55% 46%);color:#fff;font-weight:800;font-size:16px;font-family:var(--display)}
.emoav.ini.sm{font-size:13px}.emoav.ini.lg{font-size:26px}.emoav.ini.xs{font-size:10px}
.emoav.champ::after{content:"👑";position:absolute;top:-9px;right:-7px;font-size:15px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));transform:rotate(18deg)}
.emoav.lg.champ::after{font-size:20px;top:-11px;right:-8px}
.avhead{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.avmeta{min-width:0}
.avmeta .note{display:block;margin-top:2px}
.avprev{width:124px;height:124px;border-radius:50%;box-shadow:0 0 0 5px var(--paper),0 0 0 7px var(--accent),0 20px 40px rgba(0,0,0,.25);flex:none;background:var(--paper3)}
.avprev svg{width:100%;height:100%;display:block;border-radius:50%}
.avtabs{display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--paper2);overflow-x:auto;scrollbar-width:none;margin:0 0 12px}
.avtabs::-webkit-scrollbar{display:none}
.avtab{background:none;border:0;padding:8px 13px;font-weight:800;font-size:13px;color:var(--ink2);border-radius:999px;cursor:pointer;white-space:nowrap}
.avtab[aria-selected="true"]{background:var(--ink);color:var(--cream)}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px}
.avopt{background:var(--paper2);border:2px solid transparent;border-radius:16px;padding:5px;cursor:pointer;transition:transform .12s ease,border-color .12s ease,background .12s ease}
.avopt svg{width:100%;height:auto;display:block;border-radius:50%}
.avopt:hover{transform:translateY(-2px);background:var(--paper3)}
.avopt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%, var(--paper2))}
.avrow{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.avrow:first-of-type{border-top:0}
.avrow .lab{font-size:13px;font-weight:800}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.swatches button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1.5px solid var(--line);background:var(--paper2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.switch{position:relative;display:inline-block;width:48px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--paper3);transition:background .15s ease;cursor:pointer}
.switch i::before{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .15s ease}
.switch input:checked + i{background:var(--good)}
.switch input:checked + i::before{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--accent)}

/* ---------- quiz ---------- */
.progress{height:8px;background:var(--paper3);border-radius:99px;overflow:hidden;margin:8px 0 16px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .3s ease;box-shadow:0 0 12px color-mix(in srgb,var(--accent) 55%, transparent)}
.qnum{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:800}
.q{font-size:23px;font-weight:800;line-height:1.28;margin:6px 0 18px;text-wrap:balance;letter-spacing:-.015em}
.streak{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:800;color:#fff;background:linear-gradient(120deg,#FF6A3D,#FFB020);box-shadow:0 4px 14px rgba(255,120,40,.45);animation:flare 1.4s ease-in-out infinite}
@keyframes flare{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.timerbar{position:sticky;top:8px;z-index:5;display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:10px 14px;border-radius:16px;
  background:rgba(18,16,38,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 30px rgba(0,0,0,.4);color:var(--cream)}
.timerbar .tleft{font-family:var(--display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums;min-width:62px;letter-spacing:-.02em}
.timerbar .tnote{font-size:11px;color:var(--cream2);text-transform:uppercase;letter-spacing:.12em;font-weight:800}
.timerbar .tprog{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.timerbar .tprog i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--glow),var(--glow2));box-shadow:0 0 12px color-mix(in srgb,var(--glow) 60%, transparent)}
.timerbar.warn{border-color:var(--accent2)}
.timerbar.warn .tleft{color:var(--accent2)}
.timerbar.warn .tprog i{background:var(--accent2)}
.timerbar.danger{border-color:#FF5A5F;background:rgba(80,14,20,.8);animation:alarm 1s ease-in-out infinite}
.timerbar.danger .tleft{color:#FF7A7E}
.timerbar.danger .tprog i{background:#FF5A5F}
@keyframes alarm{0%,100%{box-shadow:0 10px 30px rgba(0,0,0,.4)}50%{box-shadow:0 10px 30px rgba(255,60,70,.45)}}
.qvis{font-size:clamp(34px,11vw,52px);line-height:1.35;text-align:center;letter-spacing:.12em;margin:14px 0 4px;background:var(--paper2);border-radius:18px;padding:22px 14px;word-break:break-word;box-shadow:inset 0 2px 0 rgba(255,255,255,.7)}
.qimg{margin:14px 0 4px}
.qimg img{display:block;width:100%;max-height:340px;object-fit:cover;border-radius:16px;background:var(--paper2)}
.qimg figcaption{font-size:11px;color:var(--muted);margin-top:6px;text-align:center}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;color:var(--ink);font-weight:600;
  box-shadow:0 3px 0 var(--line);transition:transform .1s ease,border-color .12s ease,background .12s ease,box-shadow .12s ease}
.opt:hover:not([disabled]){border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 0 var(--line),0 10px 20px color-mix(in srgb,var(--accent) 14%, transparent)}
.opt:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt .k{font-family:var(--display);font-size:14px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--paper);color:var(--ink2);flex:none;line-height:1;box-shadow:inset 0 0 0 1.5px var(--line)}
.opt[data-state="right"]{background:var(--good-bg);border-color:var(--good);box-shadow:0 3px 0 color-mix(in srgb,var(--good) 55%, transparent);animation:pop .4s cubic-bezier(.2,.8,.2,1)}
.opt[data-state="right"] .k{background:var(--good);color:#fff;box-shadow:none}
.opt[data-state="wrong"]{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 50%, transparent);animation:shake .45s ease}
.opt[data-state="wrong"] .k{background:var(--bad);color:#fff;box-shadow:none}
.opt[disabled]{cursor:default}
.opt[data-state="sel"]{background:color-mix(in srgb,var(--accent) 12%, var(--paper2));border-color:var(--accent)}
.opt[data-state="sel"] .k{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.opt small{color:var(--muted);font-weight:500;font-size:12px}
@keyframes pop{0%{transform:scale(.97)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.why{margin-top:14px;padding:15px 16px;border-radius:14px;background:var(--paper2);border-left:5px solid var(--accent2)}
.why b{display:block;margin-bottom:4px}
.why.good{border-left-color:var(--good)}.why.bad{border-left-color:var(--bad)}.why.part{border-left-color:var(--part)}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--paper3);color:var(--ink2)}
.pill.easy{background:var(--good-bg);color:var(--good)}
.pill.medium{background:var(--part-bg);color:var(--part)}
.pill.hard{background:var(--bad-bg);color:var(--bad)}
.pill.live{background:color-mix(in srgb,var(--good) 20%, var(--paper));color:var(--good)}
.pill.done{background:color-mix(in srgb,var(--accent) 14%, var(--paper));color:var(--ink)}

/* ---------- result ---------- */
.stat{font-family:var(--display);font-size:clamp(72px,20vw,124px);line-height:.92;letter-spacing:-.05em;
  background:linear-gradient(100deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 10px 24px color-mix(in srgb,var(--accent) 28%, transparent))}
.stat small{font-size:.3em;font-family:var(--body);font-weight:800;color:var(--muted);-webkit-text-fill-color:var(--ink2)}
.verdict{font-size:20px;font-weight:800;margin:6px 0 4px;letter-spacing:-.01em}
.review .item{padding:12px 0;border-top:1px solid var(--line)}
.review .item:first-child{border-top:0}
.review .item .q{font-size:16px;margin:0 0 4px}
.review .ans{font-size:14px;font-weight:600}
.review .ans.good{color:var(--good)}.review .ans.bad{color:var(--bad)}.review .ans.part{color:var(--part)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.share{margin-top:18px;padding:16px;border-radius:16px;background:var(--paper2)}
.share img{display:block;width:100%;max-width:340px;margin:0 auto 14px;border-radius:16px;box-shadow:var(--shadow)}
.share .msg{min-height:1.2em}
.recapfacts{margin-top:12px}
.hardq{margin-top:12px}

/* ---------- stats, poll, host ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:4px}
.stile{background:var(--paper);border-radius:18px;padding:14px 14px 12px;box-shadow:var(--shadow)}
.stile b{display:block;font-family:var(--display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em;background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stile span{display:block;font-size:11px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.stile.season{grid-column:1 / -1;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 14%, var(--paper)),var(--paper))}
.srow{display:grid;grid-template-columns:104px 1fr auto;gap:10px;align-items:center;padding:7px 0}
.slab{font-size:14px;font-weight:800}
.sbar{height:9px;border-radius:99px;background:var(--paper3);overflow:hidden}
.sbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%, var(--accent2)))}
.sval{font-size:14px;font-variant-numeric:tabular-nums;min-width:74px;text-align:right;font-weight:700}
.sval small{color:var(--muted);font-size:11px;font-weight:600}
/* ---------- chat ---------- */
.tabcount{display:inline-block;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;line-height:16px;text-align:center;margin-left:5px;vertical-align:1px;box-shadow:0 0 10px color-mix(in srgb,var(--accent) 60%, transparent)}
@media (max-width:430px){.tabs .tab{padding:9px 11px;font-size:14.5px}.tabs{padding:3px}}
@media (max-width:400px){.tabs .tab{padding:9px 8px;font-size:13.5px;letter-spacing:-.01em}.tabcount{margin-left:4px}}
/* on a narrow phone the row scrolls; fade the right edge so that reads as more to come */
#view .tabs{position:relative;-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%)}
@media (min-width:431px){#view .tabs{-webkit-mask-image:none;mask-image:none}}
.tab[aria-selected="true"] .tabcount{background:var(--accent)}
.banner.chatping{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.banner.chatping b{color:var(--cream)}
.banner.chatping.tagged{background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 30%, var(--stage2)),var(--stage2));border-color:color-mix(in srgb,var(--accent) 55%, transparent)}
.chatbox{padding:16px}
.chatto{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.chatto .tolab{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.tochip{display:inline-flex;align-items:center;gap:2px;border:1.5px solid var(--line);background:var(--paper2);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer}
.tochip.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.tochip .emoav.xs{margin-right:4px}
.chatgenres{margin:0 0 12px}
.chatgenres .chip{font-size:12.5px}
.chatlines{display:grid;gap:7px}
.chatline{text-align:left;background:var(--paper2);border:1.5px solid var(--line);border-radius:13px;padding:11px 13px;font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--line);transition:transform .1s ease,border-color .12s ease,background .12s ease}
.chatline:hover:not([disabled]){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%, var(--paper2))}
.chatline:active:not([disabled]){transform:translateY(2px);box-shadow:none}
.chatline[disabled]{opacity:.5;cursor:default}
.thread{display:grid;gap:8px;margin-top:14px}
.cmsg{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)}
.cmsg.mine{background:color-mix(in srgb,var(--accent) 14%, rgba(255,255,255,.05));border-color:color-mix(in srgb,var(--accent) 35%, transparent)}
.cmsg.atme{box-shadow:inset 3px 0 0 var(--gold)}
.cmsg.fresh{border-color:color-mix(in srgb,var(--accent) 45%, transparent)}
.cnew{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:99px;padding:2px 6px;line-height:1.2}
.cbody{min-width:0}
.cwho{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--cream2);display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.ctag{color:var(--gold);text-transform:none;letter-spacing:0;font-size:12px}
.cwhen{font-weight:600;color:var(--cream2);opacity:.7;letter-spacing:0;text-transform:none;font-size:11px}
.ctext{color:var(--cream);font-size:15px;line-height:1.4;margin-top:3px}
.cdel{background:none;border:0;color:var(--cream2);font-size:20px;line-height:1;cursor:pointer;padding:0 2px;opacity:.5}
.cdel:hover{opacity:1;color:var(--bad)}
.lcard{background:var(--paper);border-radius:20px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.lcard::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--ra,var(--accent))}
.lhead{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.lround{flex:1;min-width:0;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eye{width:34px;height:34px;flex:none;border-radius:50%;border:1.5px solid var(--line);background:var(--paper2);color:var(--ink2);cursor:pointer;display:grid;place-items:center;padding:0}
.eye svg{width:19px;height:19px}
.eye:hover{border-color:var(--accent);color:var(--accent)}
.eye[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:var(--cream)}

      {d:"easy",q:"Beyoncé was a member of which group before going solo?",

      {d:"hard",q:"Richard Hatch won the first US season of which reality show in 2000?",

      {d:"medium",q:"What is the name of Harry Potter's owl?",

      {d:"easy",q:"What instrument does Lisa Simpson play?",

      {d:"easy",q:"Who played the Joker in \"The Dark Knight\" (2008)?",
       o:["Heath Ledger","Jack Nicholson","Joaquin Phoenix","Jared Leto"],a:0,
       w:"Ledger won a posthumous Oscar for Best Supporting Actor in 2009. Nicholson played the Joker in 1989, Leto in 2016 and Phoenix in 2019."},
      {d:"medium",q:"In \"Game of Thrones,\" what is the ancestral home of House Stark?",
       o:["Winterfell","Casterly Rock","Dragonstone","Highgarden"],a:0,
       w:"Casterly Rock belongs to the Lannisters, Dragonstone to the Targaryens and Highgarden to the Tyrells. The show ran on HBO from 2011 to 2019."},
      {d:"medium",q:"Which video was the first to reach one billion views on YouTube?",

  {
    id: "living-memory",
    added: "2026-09-19T22:08:00Z",
    name: "Living Memory",
    subject: "Modern history",
    tagline: "Twenty questions from the first powered flight to the pandemic. 1900 to now, in order.",
    theme: { font: "Oswald", accent: "#1D4ED8", accent2: "#DC2626", accentDark: "#60A5FA", accent2Dark: "#F87171" },
    questions: [
      {d:"easy",q:"Where did the Wright brothers make the first powered flight in December 1903?",
       o:["Kitty Hawk, North Carolina","Dayton, Ohio","Cape Cod, Massachusetts","Pensacola, Florida"],a:0,
       w:"Orville flew first, for 12 seconds and 120 feet, on December 17, 1903. The brothers were bicycle makers from Dayton who chose the Outer Banks for its steady wind and soft sand."},
      {d:"hard",q:"Which ship answered the Titanic's distress calls and picked up the survivors in April 1912?",
       o:["Carpathia","Californian","Olympic","Lusitania"],a:0,
       w:"The Cunard liner Carpathia raced 58 miles through the ice and rescued about 705 people. The Californian was much closer, but its only radio operator had gone to bed."},
      {d:"easy",q:"The 1918 influenza pandemic is commonly named after which country?",
       o:["Spain","Russia","China","France"],a:0,
       w:"Spain was neutral in the war, so its newspapers reported the outbreak freely while the fighting nations censored theirs. It killed an estimated 50 million people worldwide."},
      {d:"medium",q:"Which amendment gave women the vote across the United States in 1920?",
       o:["The 19th","The 15th","The 18th","The 21st"],a:0,
       w:"Tennessee became the 36th state to ratify it in August 1920, by one vote. The 18th brought in Prohibition, the 21st repealed it, and the 15th barred voting restrictions based on race."},
      {d:"hard",q:"Gandhi's 1930 Salt March ended at the sea at which village?",
       o:["Dandi","Ahmedabad","Surat","Porbandar"],a:0,
       w:"He walked 240 miles from his ashram in Ahmedabad over 24 days and picked up a handful of salt on April 6, 1930, breaking the British monopoly. Porbandar is where he was born."},
      {d:"easy",q:"Germany's invasion of which country in September 1939 led Britain and France to declare war?",
       o:["Poland","Czechoslovakia","Austria","Belgium"],a:0,
       w:"The invasion began on September 1 and the declarations came on September 3. The Soviet Union invaded Poland from the east sixteen days later under its secret pact with Hitler."},
      {d:"easy",q:"The D-Day landings of June 6, 1944 took place in which region of France?",
       o:["Normandy","Brittany","Provence","Pas-de-Calais"],a:0,
       w:"Troops landed on five beaches: Utah, Omaha, Gold, Juno and Sword. The Allies had spent months faking a buildup opposite Calais, and the Germans kept reserves there for weeks."},
      {d:"medium",q:"What was the name of the B-29 that dropped the atomic bomb on Hiroshima on August 6, 1945?",
       o:["Enola Gay","Bockscar","Memphis Belle","Spirit of St. Louis"],a:0,
       w:"Pilot Paul Tibbets named it after his mother. Bockscar dropped the second bomb on Nagasaki three days later, and Japan announced its surrender on August 15."},
      {d:"medium",q:"Who became India's first prime minister at independence in 1947?",
       o:["Jawaharlal Nehru","Mahatma Gandhi","Sardar Patel","Muhammad Ali Jinnah"],a:0,
       w:"Nehru served until his death in 1964. Jinnah became Pakistan's first governor general, and Gandhi never held office. Partition displaced around 15 million people."},
      {d:"medium",q:"Which city was kept supplied entirely by air for nearly a year after the Soviets cut its ground routes in 1948?",
       o:["West Berlin","Vienna","Prague","Warsaw"],a:0,
       w:"The Berlin Airlift ran from June 1948 to May 1949: about 280,000 flights carrying 2.3 million tons of food and coal. Pilot Gail Halvorsen became the \"candy bomber\" for dropping sweets to children."},
      {d:"easy",q:"Who was the first human in space, on April 12, 1961?",
       o:["Yuri Gagarin","Alan Shepard","John Glenn","Valentina Tereshkova"],a:0,
       w:"Gagarin made one orbit in Vostok 1 in 108 minutes. Shepard's suborbital flight came three weeks later, Glenn was the first American to orbit in 1962, and Tereshkova was the first woman in space in 1963."},
      {d:"medium",q:"Which Soviet leader faced John F. Kennedy during the Cuban Missile Crisis in October 1962?",
       o:["Nikita Khrushchev","Leonid Brezhnev","Joseph Stalin","Yuri Andropov"],a:0,
       w:"After thirteen days the Soviets withdrew the missiles in return for a US pledge not to invade Cuba and a secret promise to remove American missiles from Turkey."},
      {d:"easy",q:"Martin Luther King Jr. gave his \"I Have a Dream\" speech in 1963 on the steps of which monument?",
       o:["The Lincoln Memorial","The Washington Monument","The US Capitol","The Jefferson Memorial"],a:0,
       w:"About 250,000 people came to the March on Washington on August 28, 1963. The dream passage was partly improvised after Mahalia Jackson called out, \"Tell them about the dream, Martin.\""},
      {d:"hard",q:"Who was the Apollo 11 astronaut who stayed in lunar orbit while Armstrong and Aldrin walked on the Moon?",
       o:["Michael Collins","Jim Lovell","Pete Conrad","Frank Borman"],a:0,
       w:"Collins circled alone in the command module Columbia on July 20, 1969, out of radio contact on each pass behind the Moon. Conrad commanded Apollo 12 and Lovell Apollo 13."},
      {d:"medium",q:"Which country did Richard Nixon visit in February 1972 in a trip he called \"the week that changed the world\"?",
       o:["China","The Soviet Union","Cuba","North Vietnam"],a:0,
       w:"He met Mao Zedong and Zhou Enlai, ending more than twenty years of no contact between the two countries. He went on to Moscow that May to sign the first SALT arms treaty."},
      {d:"medium",q:"Nelson Mandela was released in February 1990 after how many years in prison?",
       o:["27","18","32","21"],a:0,
       w:"Eighteen of those years were on Robben Island. Four years after his release he was elected president in South Africa's first election open to all races."},
      {d:"easy",q:"In which year was the Soviet Union formally dissolved?",
       o:["1991","1989","1993","1990"],a:0,
       w:"Mikhail Gorbachev resigned on December 25, 1991 and the Soviet flag over the Kremlin came down that evening. Fifteen republics became independent states."},
      {d:"medium",q:"The collapse of which investment bank in September 2008 marked the height of the global financial crisis?",
       o:["Lehman Brothers","Bear Stearns","Merrill Lynch","Goldman Sachs"],a:0,
       w:"Lehman filed on September 15, 2008, the largest bankruptcy in US history. Bear Stearns had been sold to JPMorgan in March, and Merrill Lynch was sold to Bank of America the same weekend Lehman fell."},
      {d:"hard",q:"The Arab Spring began in December 2010 in which country?",
       o:["Tunisia","Egypt","Libya","Syria"],a:0,
       w:"It started after a street vendor, Mohamed Bouazizi, set himself on fire in protest at police harassment. President Ben Ali fled within four weeks, and Egypt's Hosni Mubarak fell a month after that."},
      {d:"easy",q:"In which month of 2020 did the World Health Organization declare COVID-19 a pandemic?",
       o:["March","January","February","April"],a:0,
       w:"The declaration came on March 11, 2020. The WHO had already declared a global health emergency on January 30, about a month after the first cases were reported in Wuhan."},
    ]
  },
  {
    id: "incredible-india",
    added: "2026-09-19T23:24:00Z",
    name: "Incredible India",
    subject: "India",
    tagline: "Twenty questions from the Taj Mahal to the Moon. Starts easy, ends hard.",
    theme: { font: "Yatra One", accent: "#D9730D", accent2: "#138808", accentDark: "#FFA24D", accent2Dark: "#4ADE80" },
    questions: [
      {d:"easy",q:"What is the capital of India?",
       o:["New Delhi","Mumbai","Kolkata","Bengaluru"],a:0,
       w:"The British moved the capital from Calcutta to Delhi in 1911. New Delhi, designed by Edwin Lutyens and Herbert Baker, was inaugurated in 1931."},
      {d:"easy",q:"The Taj Mahal stands in which city?",
       o:["Agra","Jaipur","Delhi","Lucknow"],a:0,
       w:"Shah Jahan built it on the bank of the Yamuna as a tomb for his wife Mumtaz Mahal. Work began in 1632 and the main tomb took about twelve years."},
      {d:"easy",q:"What is India's national animal?",
       o:["Bengal tiger","Asian elephant","Indian peacock","Asiatic lion"],a:0,
       w:"The tiger was declared national animal in 1972, the year before Project Tiger launched. India is now home to about three quarters of the world's wild tigers. The peacock is the national bird."},
      {d:"easy",q:"Which festival is known as the festival of lights?",
       o:["Diwali","Holi","Navratri","Onam"],a:0,
       w:"Diwali falls in October or November and for many marks Rama's return to Ayodhya. Holi, in spring, is the festival of colours."},
      {d:"easy",q:"Who is called the Father of the Nation in India?",
       o:["Mahatma Gandhi","Jawaharlal Nehru","B. R. Ambedkar","Subhas Chandra Bose"],a:0,
       w:"It was Subhas Chandra Bose who first called him that, in a 1944 radio broadcast. Gandhi's birthday, October 2, is a national holiday and the UN's International Day of Non-Violence."},
      {d:"easy",q:"What is the currency of India?",
       o:["Rupee","Rupiah","Taka","Ringgit"],a:0,
       w:"The ₹ symbol was adopted in 2010 from a design by D. Udaya Kumar. The rupiah is Indonesia's, the taka is Bangladesh's and the ringgit is Malaysia's."},
      {d:"easy",q:"Bollywood, the Hindi film industry, is based in which city?",
       o:["Mumbai","Chennai","Hyderabad","Kolkata"],a:0,
       w:"The B comes from Bombay. Chennai's Tamil industry is nicknamed Kollywood, after the Kodambakkam district, and Hyderabad's Telugu industry is Tollywood."},
      {d:"medium",q:"Which river, the holiest in Hinduism, flows past Varanasi?",
       o:["Ganga","Yamuna","Brahmaputra","Godavari"],a:0,
       w:"The Ganga rises at the Gangotri glacier in the Himalayas and runs about 2,500 km to the Bay of Bengal. The Yamuna joins it at Prayagraj."},
      {d:"medium",q:"How many times has India's men's team won the 50-over Cricket World Cup?",
       o:["Two","One","Three","Four"],a:0,
       w:"In 1983 under Kapil Dev, beating the West Indies at Lord's, and in 2011 under MS Dhoni, beating Sri Lanka at the Wankhede in Mumbai. The 2023 final was lost to Australia in Ahmedabad."},
      {d:"medium",q:"Who was India's first woman prime minister?",
       o:["Indira Gandhi","Sonia Gandhi","Pratibha Patil","Sarojini Naidu"],a:0,
       w:"She served from 1966 to 1977 and again from 1980 until her assassination in 1984. Pratibha Patil was the first woman president, in 2007, and Sarojini Naidu the first woman state governor."},
      {d:"medium",q:"Which city is known as the Pink City?",
       o:["Jaipur","Jodhpur","Udaipur","Jaisalmer"],a:0,
       w:"Maharaja Ram Singh II had the old city painted pink in 1876 to welcome the Prince of Wales. Jodhpur is the Blue City, Jaisalmer the Golden City and Udaipur the City of Lakes."},
      {d:"medium",q:"In which year did Chandrayaan-3 make India the first country to land near the Moon's south pole?",
       o:["2023","2019","2021","2024"],a:0,
       w:"The Vikram lander touched down on August 23, 2023, making India the fourth country to soft-land on the Moon. Chandrayaan-2's lander had crashed in 2019."},
      {d:"medium",q:"How many languages are listed in the Eighth Schedule of the Indian Constitution?",
       o:["22","14","18","29"],a:0,
       w:"The list started at 14 in 1950 and has grown to 22. Hindi in the Devanagari script is the official language of the Union, with English alongside it. India has no single national language."},
      {d:"medium",q:"The number 1729 is famous from a hospital visit conversation between G. H. Hardy and which Indian mathematician?",
       o:["Srinivasa Ramanujan","Aryabhata","Brahmagupta","Bhaskara II"],a:0,
       w:"Hardy said his taxi number was dull. Ramanujan replied it was the smallest number expressible as the sum of two cubes in two ways: 1³ + 12³ and 9³ + 10³."},
      {d:"hard",q:"How many spokes does the Ashoka Chakra on the Indian flag have?",
       o:["24","12","16","32"],a:0,
       w:"The wheel is taken from the Lion Capital of Ashoka at Sarnath. The flag was adopted on July 22, 1947, replacing the spinning wheel of the Congress flag with the chakra."},
      {d:"hard",q:"Which was the first Indian state created on linguistic lines, in 1953?",
       o:["Andhra State","Maharashtra","Gujarat","Kerala"],a:0,
       w:"It was carved out of Madras State after Potti Sriramulu died on a 58-day hunger strike for a Telugu-speaking state. The States Reorganisation Act redrew the whole map in 1956."},
      {d:"hard",q:"Which Indian physicist won the 1930 Nobel Prize for the light-scattering effect that bears his name?",
       o:["C. V. Raman","Satyendra Nath Bose","Homi J. Bhabha","Jagadish Chandra Bose"],a:0,
       w:"Raman was the first Asian to win a science Nobel. He made the discovery on February 28, 1928, now National Science Day. S. N. Bose gave his name to bosons but never won."},
      {d:"hard",q:"In which year did Babur win the First Battle of Panipat and found the Mughal Empire?",
       o:["1526","1556","1498","1600"],a:0,
       w:"Babur's artillery beat the much larger army of Ibrahim Lodi. The Second Battle of Panipat came in 1556, Vasco da Gama reached Calicut in 1498, and the East India Company was chartered in 1600."},
      {d:"hard",q:"Where was the first Indian Institute of Technology established, in 1951?",
       o:["Kharagpur","Bombay","Madras","Delhi"],a:0,
       w:"It was set up in the buildings of the Hijli detention camp, where the British had held independence activists. IIT Bombay followed in 1958, Madras and Kanpur in 1959 and Delhi in 1961."},
      {d:"hard",q:"What is the highest mountain located entirely within India?",
       o:["Nanda Devi","Kangchenjunga","Kamet","Trisul"],a:0,
       w:"Nanda Devi rises to 7,816 metres in Uttarakhand. Kangchenjunga is higher, but it straddles the border between Sikkim and Nepal. Kamet is India's second highest at 7,756 metres."},
    ]
  },

}

function rowHtml(b, medals){

  const chips = medals && typeof medals === "object" ? medalChips(medals[b.uid]) : "";

    <div class="rank" data-r="${b.rank}">${b.rank}</div>
    ${avatarHtml(b.uid, b.photo)}

    <div class="pts">${fmtScore(b.score)}<span> / ${b.total}</span></div>
    <div class="time">${fmtTime(b.elapsedMs)}</div>

/* the daily top-up session runs at 13:00 UTC; show the host when that lands where they are */
function nextTopUpText(){

  let t = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 13, 0, 0);
  if (t <= now) t += 864e5;
  try { return new Date(t).toLocaleString(undefined, { weekday: "short", hour: "numeric", minute: "2-digit" }); } catch (e) { return "tomorrow morning"; }
}

      <p class="note" style="margin:0 0 6px">${P.queue.length} round${P.queue.length === 1 ? "" : "s"} written and waiting${P.queue.length ? `, ${P.queue.length === 1 ? "one night" : P.queue.length + " nights"} of drops` : ""}. The daily top-up keeps it at five. The three that have waited longest are tonight's poll; anything here can be picked with the override above.</p>
      ${P.queue.length ? `<div class="qlist">${P.queue.map(r => { const open = S.qInfo === r.id; return `<div class="qitem">

      <p class="note" style="margin:0 0 6px">Type a theme and tap Add. Nothing happens on the site straight away: it joins the list below, and at <b>${esc(nextTopUpText())}</b> Claude writes it into a full 20-question round. The round then appears in the queue above and the entry here turns to “written”. Requests are always written, even when the queue is full. From the queue it reaches the poll in turn, or you can send it out tonight with the override.</p>

      <p class="note" id="reqMsg" style="margin:6px 0 0"></p>

async function prepareShare(kind){

  const fname = k === "invite" ? `babies-trivia-${esc(round.id)}.png` : k === "score" ? "babies-trivia-score.png" : k === "recap" ? `babies-trivia-${esc(round.id)}-recap.png` : `babies-trivia-season-${S.shareSeason}.png`;
  return `<div class="share" id="sharePanel">
    ${S.shareUrl ? `<img src="${S.shareUrl}" alt="${alt}">` : `<p class="note" style="text-align:center">Building the card…</p>`}
    <div class="row" style="justify-content:center">

function wireShare(){

name: Publish rounds

# Writes rounds/*.json (the original game) and games/<id>/rounds/*.json (each
# sister game) into Firestore whenever they change on main, or on demand. Uses
# the FIREBASE_SERVICE_ACCOUNT secret. No Netlify deploy is needed for rounds.

on:
  push:
    branches: [main]
    paths:
      - rounds/**
      - games/*/rounds/**
      - games/*.json
      - poll.json
      - scripts/publish-rounds.mjs
      - .github/workflows/publish-rounds.yml
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the secret is present
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT is not set."
            exit 1
          fi
          printf '%s' "$KEY" > "$RUNNER_TEMP/service-account.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/service-account.json','utf8'))" \
            || { echo "::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON."; exit 1; }

      - name: Publish rounds to Firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: |
          npm install firebase-admin@^12 --no-save --no-audit --no-fund
          node scripts/publish-rounds.mjs

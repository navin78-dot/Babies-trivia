name: Deploy sites

# Uploads both games to Netlify with the Netlify CLI, without a Netlify build.
# Babies' Trivia used to be built by Netlify itself on every push; since 27 Sep
# 2026 netlify.toml cancels those builds and this workflow publishes instead. Runs only when
# something that goes into a site changed, and uploads a site only when its page
# differs from what it already serves, because on Netlify's credit plans every
# successful production deploy costs 15 credits whether or not Netlify built it
# (the team's allowance is 1000 a month, so about 66 deploys). Needs the
# NETLIFY_AUTH_TOKEN secret (a Netlify personal access token).

on:
  push:
    branches: [main]
    paths:
      - index.html
      - manifest.webmanifest
      - sw.js
      - icons/**
      - games/*.json
      - scripts/build-site.mjs
      - .github/workflows/deploy-sites.yml
  workflow_dispatch:

concurrency:
  group: deploy-sites
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BABIES_SITE_ID: 9036149d-951a-4517-bda1-41097f45e30e
      HAMPS_SITE_ID: e0866c7a-ec1a-4d95-9d2b-9d1bdfa4fed0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build both sites
        run: |
          mkdir -p dist/babies/icons && cp index.html manifest.webmanifest sw.js dist/babies/ && cp icons/babies-*.png dist/babies/icons/
          node scripts/build-site.mjs hamps dist/hamps && cp sw.js dist/hamps/

      - name: Check the token is present
        id: token
        env:
          TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Repository secret NETLIFY_AUTH_TOKEN is not set, so the sites were built but not uploaded. Create a personal access token at https://app.netlify.com/user/applications#personal-access-tokens, add it under Settings > Secrets and variables > Actions, then run this workflow again."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Netlify
        if: steps.token.outputs.skip != '1'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          msg=$(git log -1 --pretty=%s | head -c 120)
          # Whether a site needs uploading is decided below by comparing the build with what the site already
          # serves, never by diffing commits: a push can carry several commits (a report commit on top of a site
          # change once made this step skip Babies and ship only Hamps).
          for site in babies hamps; do
            id=$BABIES_SITE_ID; host=babiestrivia.netlify.app; [ "$site" = "hamps" ] && id=$HAMPS_SITE_ID && host=hampscrew.netlify.app
            # Every successful production deploy costs 15 Netlify credits, so never upload a page the site already serves.
            same=1
            for f in index.html manifest.webmanifest; do
              curl -sSf -H 'Cache-Control: no-cache' "https://$host/$f?nocache=$(date +%s)" -o live.tmp 2>/dev/null || { same=0; break; }
              cmp -s live.tmp dist/$site/$f || { same=0; break; }
            done
            if [ "$same" = "1" ]; then echo "$site: live page already matches this build, skipping (saves 15 credits)"; continue; fi
            npx --yes netlify-cli@17 deploy --prod --dir=dist/$site --site="$id" --auth="$NETLIFY_AUTH_TOKEN" --message="$msg" --json > deploy-$site.json
            echo "$site live at $(jq -r '.url // .deploy_url' deploy-$site.json)"
          done

      - name: Check the pages are served as HTML
        if: steps.token.outputs.skip != '1'
        run: |
          set -euo pipefail
          sleep 5
          for host in babiestrivia.netlify.app hampscrew.netlify.app; do
            ct=$(curl -sSI "https://$host/" | tr -d '\r' | awk 'tolower($1)=="content-type:" {print tolower($2)}')
            echo "$host content-type: $ct"
            case "$ct" in text/html*) ;; *) echo "::error::$host is not being served as HTML (got '$ct')"; exit 1 ;; esac
          done

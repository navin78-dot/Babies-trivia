name: Host tools

# Things the host would otherwise do on the Host tab, runnable from here on demand.
# Uses FIREBASE_SERVICE_ACCOUNT. Tools:
#   override       set or clear a game's nightly-drop override (needs day and round)
#   reset-catchup  show the one-time catch-up card again (needs who: "all" or the end of a uid)
#   make-live      make a waiting round live now, keeping its saved runs (needs round; day = ISO timestamp for its added date, optional)

on:
  workflow_dispatch:
    inputs:
      tool:
        description: "Which tool"
        required: true
        type: choice
        options: [override, reset-catchup, make-live]
        default: override
      game:
        description: "Game id: babies or hamps"
        required: true
        default: hamps
      day:
        description: "override: the drop day, YYYY-MM-DD New York time. make-live: ISO timestamp to record as the round's added date (optional)."
        required: false
      round:
        description: "override: round id to drop, or 'clear' to remove the override"
        required: false
      who:
        description: "reset-catchup: 'all' or the last characters of one player's uid"
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write the service-account key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT is not set."; exit 1; fi
          printf '%s' "$KEY" > "$RUNNER_TEMP/service-account.json"
      - name: Run the tool
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: |
          npm install firebase-admin@^12 --no-save --no-audit --no-fund
          case "${{ inputs.tool }}" in
            override) node scripts/set-override.mjs "${{ inputs.game }}" "${{ inputs.day }}" "${{ inputs.round }}" ;;
            reset-catchup) node scripts/reset-catchup.mjs "${{ inputs.game }}" "${{ inputs.who }}" ;;
            make-live) node scripts/make-live.mjs "${{ inputs.game }}" "${{ inputs.round }}" ${{ inputs.day }} ;;
            *) echo "::error::unknown tool"; exit 1 ;;
          esac

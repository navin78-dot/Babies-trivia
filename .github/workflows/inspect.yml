name: Inspect data

# Read-only look at one game's data for debugging, printed to the run log.
# Nothing is written. Run it by hand and pick the script.

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script under scripts/ to run (without .mjs)"
        required: true
        default: inspect-catchup
      game:
        description: "Game id (babies or a sister game id)"
        required: true
        default: hamps

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write the service-account key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT is not set."; exit 1; fi
          printf '%s' "$KEY" > "$RUNNER_TEMP/service-account.json"
      - name: Run
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: |
          npm install firebase-admin@^12 --no-save --no-audit --no-fund
          node "scripts/${{ inputs.script }}.mjs" "${{ inputs.game }}"

name: Queue status

# Reports how many written rounds are waiting for the nightly drop, tonight's poll,
# and any theme requests, and commits the report as queue-status.json so the daily
# top-up session can read it with plain git. Runs every morning and on demand.

on:
  schedule:
    - cron: "45 12 * * *"   # 08:45 New York in summer, 07:45 in winter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write the service-account key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT is not set."; exit 1; fi
          printf '%s' "$KEY" > "$RUNNER_TEMP/service-account.json"
      - name: Report the queue
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: |
          npm install firebase-admin@^12 --no-save --no-audit --no-fund
          node scripts/queue-status.mjs
      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue-status.json
          git diff --cached --quiet || (git commit -m "Queue status report" && git push)

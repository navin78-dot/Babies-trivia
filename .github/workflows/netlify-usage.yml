name: Netlify usage

# Asks Netlify how much of the plan has been used, so nobody has to open the
# dashboard. Runs every morning and on demand; writes netlify-usage.json at the
# repository root (numbers only, no tokens or billing details). Uses the same
# NETLIFY_AUTH_TOKEN the Hamps deploy uses.

on:
  schedule:
    - cron: "50 12 * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Also print the raw shape of what Netlify returns (keys only)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask Netlify
        env:
          TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          ACCOUNT: navin78
          PROBE: ${{ inputs.probe }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then echo "::error::NETLIFY_AUTH_TOKEN is not set"; exit 1; fi
          h="Authorization: Bearer $TOKEN"
          curl -sS -H "$h" "https://api.netlify.com/api/v1/accounts/$ACCOUNT" > account.json || echo '{}' > account.json
          curl -sS -H "$h" "https://api.netlify.com/api/v1/accounts/$ACCOUNT/usage" > usage.json || echo '{}' > usage.json
          curl -sS -H "$h" "https://api.netlify.com/api/v1/accounts/$ACCOUNT/credits" > credits.json || echo '{}' > credits.json
          curl -sS -H "$h" "https://api.netlify.com/api/v1/accounts/$ACCOUNT/billing" > billing.json || echo '{}' > billing.json
          if [ "$PROBE" = "true" ]; then
            for f in account usage credits billing; do
              echo "== $f: $(head -c 1 $f.json)"; node -e "
                const fs=require('fs'); let j; try { j=JSON.parse(fs.readFileSync('$f.json','utf8')); } catch(e){ console.log('  not json: '+fs.readFileSync('$f.json','utf8').slice(0,120)); process.exit(0); }
                const walk=(o,p,d)=>{ if(d>3||o===null||typeof o!=='object') return; for(const [k,v] of Object.entries(o)){ const path=p?p+'.'+k:k; if(/credit|usage|minute|bandwidth|limit|quota|plan|period|used|included|remaining|balance|cycle|allowance/i.test(path)) console.log('  '+path+' = '+(typeof v==='object'?JSON.stringify(v).slice(0,200):String(v).slice(0,80))); walk(v,path,d+1);} };
                walk(j,'',0); if(!Object.keys(j).length) console.log('  (empty)');
              "
            done
          fi
          node -e "
            const fs=require('fs'); const rd=f=>{ try { return JSON.parse(fs.readFileSync(f,'utf8')); } catch(e){ return null; } };
            const a=rd('account.json')||{}, u=rd('usage.json'), c=rd('credits.json'), b=rd('billing.json');
            const pick=(o,keys)=>{ const out={}; if(!o||typeof o!=='object') return out; for(const k of keys) if(k in o) out[k]=o[k]; return out; };
            const out={ checkedAt:new Date().toISOString(), plan:a.type_name||a.type||null, billingPeriod:pick(a,['billing_period','billing_name']).billing_period||null,
              capabilities:a.capabilities||null, usage:u&&!u.code?u:null, credits:c&&!c.code?c:null, billing:b&&!b.code?pick(b,['credits','usage','period_start','period_end','plan','included','used','remaining']):null };
            fs.writeFileSync('netlify-usage.json', JSON.stringify(out,null,2)); console.log(JSON.stringify(out,null,2).slice(0,3000));
          "
      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify-usage.json
          git diff --cached --quiet || (git commit -m "Netlify usage report" && git push)

name: Deploy Hamps Crew site

# Builds the Hamps Crew site from index.html + games/hamps.json and uploads it to
# its own Netlify project (hampscrew.netlify.app) with the Netlify CLI. No Netlify
# build runs, so this does not spend build credits, and it only runs when
# something that goes into that site changed. A raw zip upload through the API
# was tried first and Netlify served the page as plain text, so the CLI it is. Needs one repository secret,
# NETLIFY_AUTH_TOKEN: a Netlify personal access token from
# https://app.netlify.com/user/applications#personal-access-tokens

on:
  push:
    branches: [main]
    paths:
      - index.html
      - games/hamps.json
      - scripts/build-site.mjs
      - .github/workflows/deploy-hamps.yml
  workflow_dispatch:

concurrency:
  group: deploy-hamps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE_ID: e0866c7a-ec1a-4d95-9d2b-9d1bdfa4fed0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the site
        run: node scripts/build-site.mjs hamps dist/hamps

      - name: Check the token is present
        env:
          TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Repository secret NETLIFY_AUTH_TOKEN is not set, so the Hamps Crew site was built but not uploaded. Create a personal access token at https://app.netlify.com/user/applications#personal-access-tokens, add it under Settings > Secrets and variables > Actions, then run this workflow again."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
        id: token

      - name: Upload to Netlify
        if: steps.token.outputs.skip != '1'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ env.SITE_ID }}
        run: |
          set -euo pipefail
          msg=$(git log -1 --pretty=%s | head -c 120)
          npx --yes netlify-cli@17 deploy --prod --dir=dist/hamps --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="$msg" --json > deploy.json
          cat deploy.json
          url=$(jq -r '.url // .deploy_url' deploy.json)
          echo "live at $url"

      - name: Check the page is served as HTML
        if: steps.token.outputs.skip != '1'
        run: |
          set -euo pipefail
          sleep 5
          ct=$(curl -sSI "https://hampscrew.netlify.app/" | tr -d '\r' | awk 'tolower($1)=="content-type:" {print tolower($2)}')
          echo "content-type: $ct"
          case "$ct" in
            text/html*) echo "ok" ;;
            *) echo "::error::hampscrew.netlify.app is not being served as HTML (got '$ct')"; exit 1 ;;
          esac

name: Deploy Hamps Crew site

# Builds the Hamps Crew site from index.html + games/hamps.json and uploads it to
# its own Netlify project (hampscrew.netlify.app) through the Netlify API. No
# Netlify build runs, so this does not spend build credits, and it only runs when
# something that goes into that site changed. Needs one repository secret,
# NETLIFY_AUTH_TOKEN: a Netlify personal access token from
# https://app.netlify.com/user/applications#personal-access-tokens

on:
  push:
    branches: [main]
    paths:
      - index.html
      - games/hamps.json
      - scripts/build-site.mjs
      - .github/workflows/deploy-hamps.yml
  workflow_dispatch:

concurrency:
  group: deploy-hamps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE_ID: e0866c7a-ec1a-4d95-9d2b-9d1bdfa4fed0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the site
        run: node scripts/build-site.mjs hamps dist/hamps

      - name: Check the token is present
        env:
          TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Repository secret NETLIFY_AUTH_TOKEN is not set, so the Hamps Crew site was built but not uploaded. Create a personal access token at https://app.netlify.com/user/applications#personal-access-tokens, add it under Settings > Secrets and variables > Actions, then run this workflow again."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
        id: token

      - name: Upload to Netlify
        if: steps.token.outputs.skip != '1'
        env:
          TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          (cd dist/hamps && zip -qr ../hamps.zip .)
          title=$(git log -1 --pretty=%s | head -c 120 | jq -sRr @uri)
          resp=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/zip" \
            --data-binary @dist/hamps.zip \
            "https://api.netlify.com/api/v1/sites/$SITE_ID/deploys?title=$title")
          id=$(echo "$resp" | jq -r .id)
          echo "deploy $id created, state $(echo "$resp" | jq -r .state)"
          for i in $(seq 1 40); do
            sleep 5
            d=$(curl -sS -H "Authorization: Bearer $TOKEN" "https://api.netlify.com/api/v1/deploys/$id")
            state=$(echo "$d" | jq -r .state)
            case "$state" in
              ready) echo "live at $(echo "$d" | jq -r .ssl_url)"; exit 0 ;;
              error) echo "::error::Netlify reported an error: $(echo "$d" | jq -r .error_message)"; exit 1 ;;
              *) echo "  $state" ;;
            esac
          done
          echo "::error::Deploy $id did not become ready in time"; exit 1

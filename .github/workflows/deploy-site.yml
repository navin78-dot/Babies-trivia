name: Deploy site

# A manual fallback. Netlify normally learns about a push through a webhook from
# GitHub. That webhook went quiet on 22 Sep 2026 for a few hours and site changes
# sat unbuilt, so this workflow was written to nudge Netlify itself. The webhook
# then came back, and running both meant every push was built twice, because a
# build started by a build hook bypasses the ignore rule in netlify.toml that
# would otherwise cancel the duplicate.
#
# So this no longer runs on push. If a push to main ever fails to appear on
# Netlify's Deploys page within a few minutes, run this by hand from the Actions
# tab (or ask Claude to) and it asks Netlify to build main.
#
# Needs one repository secret, NETLIFY_BUILD_HOOK: the URL of a build hook made
# in Netlify under Project configuration -> Build & deploy -> Build hooks.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Netlify to build main
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Repository secret NETLIFY_BUILD_HOOK is not set. Create a build hook in Netlify and save its URL as that secret."
            exit 1
          fi
          case "$HOOK" in
            https://api.netlify.com/build_hooks/*) ;;
            *) echo "::error::NETLIFY_BUILD_HOOK does not look like a Netlify build hook URL."; exit 1 ;;
          esac
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -d '{}' "$HOOK")
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error::Netlify answered HTTP $code to the build hook."
            exit 1
          fi
          echo "Netlify accepted the build request (HTTP $code). It builds main from GitHub as normal."

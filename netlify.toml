# Babies' Trivia is one static file. There is nothing to compile, so the "build"
# just publishes the repository root.
#
# Only index.html is served, so a commit that touches nothing else does not need
# a deploy. The ignore command below decides that from the files that actually
# changed since the last published deploy, which is safer than putting a
# [skip netlify] marker in a commit message: Netlify reads only the newest commit
# of a push, so a trailing data commit used to cancel the build for a site change
# behind it and the change never went live.
#
# git diff --quiet exits 0 when there is no difference, and Netlify cancels the
# build on exit 0. So: index.html unchanged -> no deploy, index.html changed -> deploy.

[build]
  publish = "."
  command = "echo 'static site, nothing to build'"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html"
